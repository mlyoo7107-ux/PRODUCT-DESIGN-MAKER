<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 확인 중 — COLOR.M</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--a:#ff2d86;--b:#f5f1e8;--l:#e8e1d3;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.wrap{max-width:480px;margin:auto;padding:60px 20px;text-align:center}
.icon{font-size:44px}
h1{font-size:22px;margin:16px 0 8px}
p{color:var(--m);font-size:14px;line-height:1.6}
.box{text-align:left;background:white;border:1px solid var(--l);border-radius:14px;padding:16px;margin-top:20px;font-size:13px;line-height:1.8}
.box b{color:var(--t)}
.go{display:block;width:100%;padding:16px;background:var(--a);color:white;border:0;border-radius:28px;font-size:16px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;margin-top:22px}
.go:hover{background:#e0247a}
.notice{font-size:12px;color:var(--m);margin-top:14px}
footer{text-align:center;padding:40px 20px}
footer img{max-width:120px}
</style></head><body>
<div class="wrap" id="app">
<div class="icon">⏳</div>
<h1>결제 확인 중이에요…</h1>
<p>잠시만 기다려 주세요.</p>
</div>
<footer><img src="logo-colorm.png" alt="COLOR.M"></footer>
<script>
// 결제 승인 서버(Workers) 주소.
const CONFIRM_API_URL = "https://colorm-pdm-payment.milan71.workers.dev/";

const PLAN_BY_PREFIX = {
  basic: { label: "BASIC", makerUrl: "index.html", unlockKey: "cmPdmPaid" },
  pro: { label: "PRO", makerUrl: "pro-index-preview.html", unlockKey: "cmPdmProPaid" }
};

function render(html){ document.getElementById("app").innerHTML = html; }
function escapeHtml(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

(async function(){
  const q = new URLSearchParams(location.search);
  const paymentKey = q.get("paymentKey");
  const orderId = q.get("orderId");
  const amount = q.get("amount");

  if(!paymentKey || !orderId || !amount){
    render(`<div class="icon">⚠️</div><h1>결제 정보를 확인할 수 없어요</h1><p>결제창을 통하지 않고 이 페이지로 바로 들어오신 것 같아요.</p><a class="go go-outline" href="landing.html">돌아가기</a>`);
    return;
  }

  const prefix = orderId.split("-")[0];
  const plan = PLAN_BY_PREFIX[prefix];
  const planLabel = plan ? plan.label : "알 수 없음";

  if(!CONFIRM_API_URL){
    // ⚠️ 프로토타입 단계: 결제 승인 서버가 아직 없어서, 여기서는 "접수"만 안내하고
    // 자동으로 잠금을 풀지 않습니다. 서버가 준비되면 아래 confirm 로직으로 교체하세요.
    render(`
      <div class="icon">🙏</div>
      <h1>결제 요청이 접수됐어요</h1>
      <p>결제 승인을 최종 확인하는 서버가 아직 준비 중이에요. 확인되는 대로 이용 안내를 보내드릴게요.</p>
      <div class="box">
        <div><b>상품</b>: ${escapeHtml(planLabel)}</div>
        <div><b>주문번호</b>: ${escapeHtml(orderId)}</div>
        <div><b>결제금액</b>: ${escapeHtml(amount)}원</div>
        <div><b>paymentKey</b>: ${escapeHtml(paymentKey)}</div>
      </div>
      <p class="notice">이 화면을 캡처해서 문의해주시면 더 빠르게 확인해드릴 수 있어요.</p>
    `);
    return;
  }

  try{
    const res = await fetch(CONFIRM_API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentKey, orderId, amount })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok){
      render(`<div class="icon">⚠️</div><h1>결제 확인에 실패했어요</h1><p>${escapeHtml(data.error||"잠시 후 다시 시도해 주세요.")}</p><a class="go go-outline" href="landing.html">돌아가기</a>`);
      return;
    }
    if(plan){
      try{ localStorage.setItem(plan.unlockKey, "1"); }catch(e){}
    }
    render(`
      <div class="icon">🎉</div>
      <h1>결제가 완료됐어요!</h1>
      <p>${escapeHtml(planLabel)} 이용이 바로 시작돼요. 이 기기에서는 지금 바로 이용하실 수 있어요.</p>
      <a class="go" href="${plan ? plan.makerUrl : 'landing.html'}">메이커로 이동하기 →</a>
      <p class="notice">다른 기기(폰 등)에서도 쓰고 싶으시면, 결제하신 이메일로 문의해 주세요. 이용 링크를 보내드릴게요.</p>
    `);
  }catch(e){
    render(`<div class="icon">⚠️</div><h1>연결에 문제가 있어요</h1><p>인터넷 연결을 확인하고 다시 시도해 주세요.</p><a class="go go-outline" href="landing.html">돌아가기</a>`);
  }
})();
</script>
</body></html>

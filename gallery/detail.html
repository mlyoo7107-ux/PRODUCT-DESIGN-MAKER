<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작품 상세 — COLOR.M GALLERY</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.wrap{max-width:640px;margin:auto;padding:24px 20px 60px}
.back{display:inline-block;margin-bottom:16px;padding:10px 18px;border:1px solid var(--l);border-radius:20px;background:white;color:var(--t);font-size:13px;font-weight:bold;text-decoration:none}
.back:hover{border-color:var(--a);color:var(--a)}
.card{background:white;border:1px solid var(--l);border-radius:18px;overflow:hidden;box-shadow:0 2px 8px rgba(23,21,18,.05)}
.card img{width:100%;height:auto;display:block;background:var(--l);cursor:zoom-in}
.card img+img{border-top:1px solid var(--l)}
/* 전체화면으로 크게 보기 (이미지 클릭 시) */
.lightbox{position:fixed;inset:0;z-index:999;background:rgba(10,9,8,.96);display:none;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
.lightbox.on{display:flex}
.lightbox img{max-width:100vw;max-height:100vh;object-fit:contain}
.lb-close{position:absolute;top:16px;right:16px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:white;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.lb-close:hover{background:rgba(255,255,255,.28)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:white;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-nav.prev{left:12px}.lb-nav.next{right:12px}
.lb-count{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.18);color:white;font-size:12px;font-weight:bold;padding:4px 12px;border-radius:12px}
body.lb-open{overflow:hidden}
.body{padding:22px}
.maker-badge{display:inline-block;font-size:11px;font-weight:bold;padding:3px 10px;border-radius:12px;margin-bottom:10px}
.maker-badge.basic{background:#eee;color:var(--m)}
.maker-badge.pro{background:var(--a);color:white}
h1{font-size:21px;margin:0 0 6px}
.nick{color:var(--m);font-size:13px;margin:0 0 16px}
.concept{font-size:15px;line-height:1.6;margin:0 0 16px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.meta span{background:#f5f6fa;border:1px solid var(--l);border-radius:14px;padding:5px 12px;font-size:12px;color:var(--m)}
.go{display:block;width:100%;padding:15px;background:var(--a);color:white;border:0;border-radius:26px;font-size:15px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;margin-top:6px}
.go:hover{background:#e0247a}
.share-row{display:flex;gap:8px;margin-top:10px}
.share-btn{flex:1;padding:12px;border:1px solid var(--l);border-radius:20px;background:white;font-size:13px;cursor:pointer;text-align:center}
.share-btn:hover{border-color:var(--a);color:var(--a)}
.state{text-align:center;padding:100px 20px;color:var(--m)}
footer{text-align:center;padding:36px 15px 44px;border-top:1px solid var(--l)}
footer img{max-width:120px;opacity:.85}
footer p{margin:12px 0 0;font-size:12px;color:var(--m)}
footer a{color:var(--m)}
</style></head><body>
<div class="wrap">
<a class="back" href="index.html" id="backLink">← 갤러리로</a>
<div id="content"><div class="state">불러오는 중...</div></div>
</div>
<footer><img src="../logo-colorm.png" alt="COLOR.M"><p>© 2026 COLOR.M · <a href="https://colorm.net" target="_blank" rel="noopener">colorm.net</a></p></footer>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const KAKAO_JS_KEY = ""; // 카카오 디벨로퍼스에서 발급받은 JavaScript 키. 채워지면 카카오톡 공유가 활성화돼요.
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "gallery-images";

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imageUrl(path){ return supa.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

function copyLink(){
  navigator.clipboard.writeText(location.href)
    .then(()=>alert("링크가 복사됐어요!"))
    .catch(()=>alert("복사에 실패했어요. 주소를 직접 선택해서 복사해주세요."));
}
function shareKakao(item, imgUrl){
  if(!KAKAO_JS_KEY){
    copyLink();
    return;
  }
  if(!window.Kakao.isInitialized()) window.Kakao.init(KAKAO_JS_KEY);
  window.Kakao.Share.sendDefault({
    objectType: "feed",
    content: {
      title: item.title,
      description: item.concept || "COLOR.M MAKER GALLERY",
      imageUrl: imgUrl,
      link: { mobileWebUrl: location.href, webUrl: location.href }
    },
    buttons: [{ title: "작품 보러가기", link: { mobileWebUrl: location.href, webUrl: location.href } }]
  });
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");
  if(!id){
    content.innerHTML = `<div class="state">작품을 찾을 수 없어요.</div>`;
    return;
  }
  const { data, error } = await supa
    .from("submissions")
    .select("id,title,nickname,maker_type,concept,category,product,tags,image_paths,created_at")
    .eq("id", id)
    .eq("status", "approved")
    .maybeSingle();

  if(error || !data){
    content.innerHTML = `<div class="state">작품을 찾을 수 없거나 아직 공개되지 않았어요.</div>`;
    return;
  }

  /* 작품이 속한 메이커 탭(캐릭터·제품 등)의 갤러리로 돌아가기 */
  if(/^[A-Z_]+$/.test(data.product || "")) document.getElementById("backLink").href = "index.html?product=" + data.product;
  const imgUrl = imageUrl(data.image_paths[0]);
  const urls = data.image_paths.map(imageUrl);
  const many = urls.length > 1;
  /* 작품을 만든 메이커로 연결 (메이커가 아직 없으면 버튼 숨김) */
  const MAKER_URLS = { PRODUCT_DESIGN: "../index.html", CHARACTER_MAKER: "https://mlyoo7107-ux.github.io/CHARACTER-DESIGN-MAKER/" };
  const makerUrl = MAKER_URLS[data.product || "PRODUCT_DESIGN"];
  content.innerHTML = `
    <div class="card">
      ${urls.map((u, i) => `<img src="${esc(u)}" alt="${esc(data.title)} ${i + 1}" data-i="${i}" loading="lazy">`).join("")}
      <div class="body">
        <span class="maker-badge ${data.maker_type==='PRO'?'pro':'basic'}">${esc(data.maker_type)}</span>
        <h1>${esc(data.title)}</h1>
        <p class="nick">by ${esc(data.nickname)}</p>
        ${data.concept ? `<p class="concept">${esc(data.concept)}</p>` : ""}
        <div class="meta">
          ${data.category ? `<span>${esc(data.category)}</span>` : ""}
          ${(data.tags||[]).map(t=>`<span>#${esc(t)}</span>`).join("")}
        </div>
        ${makerUrl ? `<a class="go" href="${esc(makerUrl)}">✨ 나도 이 Maker로 만들어보기 →</a>` : ""}
        <a class="go" style="background:white;color:var(--a);border:1px solid var(--ab);margin-top:10px" href="sns-card.html?id=${esc(data.id)}">📸 SNS 이미지 만들기</a>
        <div class="share-row">
          <button class="share-btn" onclick="copyLink()">🔗 링크 복사</button>
          <button class="share-btn" id="kakaoBtn">💬 카카오톡 공유</button>
        </div>
        <a href="request-edit.html?id=${esc(data.id)}&title=${esc(encodeURIComponent(data.title))}" style="display:block;text-align:center;margin-top:14px;color:var(--m);font-size:12px;text-decoration:underline">✏️ 내 작품 내용 수정 요청하기</a>
      </div>
    </div>
    <div class="lightbox" id="lightbox">
      <button type="button" class="lb-close" id="lbClose" aria-label="닫기">✕</button>
      <img id="lbImg" src="" alt="">
      ${many ? `<button type="button" class="lb-nav prev" id="lbPrev" aria-label="이전 이미지">‹</button>
      <button type="button" class="lb-nav next" id="lbNext" aria-label="다음 이미지">›</button>
      <span class="lb-count" id="lbCount"></span>` : ""}
    </div>
  `;
  document.getElementById("kakaoBtn").onclick = () => shareKakao(data, imgUrl);

  /* 이미지를 탭하면 전체화면으로 크게 보기. 화살표 · 키보드 ←→ · 손가락으로 밀기로 넘기고, 닫기·배경 클릭·Esc로 닫기 */
  const lightbox = document.getElementById("lbImg") ? document.getElementById("lightbox") : null;
  if(lightbox){
    const lbImg = document.getElementById("lbImg");
    let cur = 0;
    const show = (i) => {
      cur = (i + urls.length) % urls.length;
      lbImg.src = urls[cur];
      lbImg.alt = `${data.title} ${cur + 1}`;
      if(many) document.getElementById("lbCount").textContent = `${cur + 1} / ${urls.length}`;
      if(many) new Image().src = urls[(cur + 1) % urls.length]; // 다음 이미지 미리 불러오기
    };
    const open = (i) => {
      show(i);
      lightbox.classList.add("on");
      document.body.classList.add("lb-open");
    };
    const close = () => {
      lightbox.classList.remove("on");
      document.body.classList.remove("lb-open");
    };
    document.querySelectorAll('.card img[data-i]').forEach(el => {
      el.onclick = () => open(+el.dataset.i);
    });
    document.getElementById("lbClose").onclick = close;
    lightbox.addEventListener("click", (e) => { if(e.target === lightbox) close(); });
    if(many){
      document.getElementById("lbPrev").onclick = () => show(cur - 1);
      document.getElementById("lbNext").onclick = () => show(cur + 1);
    }
    document.addEventListener("keydown", (e) => {
      if(!lightbox.classList.contains("on")) return;
      if(e.key === "Escape") close();
      if(many && e.key === "ArrowLeft") show(cur - 1);
      if(many && e.key === "ArrowRight") show(cur + 1);
    });
    let x0 = null;
    lightbox.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    lightbox.addEventListener("touchend", (e) => {
      if(x0 === null || !many) return;
      const dx = e.changedTouches[0].clientX - x0;
      if(Math.abs(dx) > 40) show(dx < 0 ? cur + 1 : cur - 1);
      x0 = null;
    });
  }
  document.title = data.title + " — COLOR.M GALLERY";
})();
</script>
</body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNS 이미지 만들기 — COLOR.M GALLERY</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.topbar{background:white;border-bottom:1px solid var(--l);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar a{color:var(--m);font-size:13px;font-weight:bold;text-decoration:none}
.topbar a:hover{color:var(--a)}
.topbar h1{font-size:15px;margin:0}
.layout{max-width:1200px;margin:auto;padding:24px 20px 80px;display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:white;border:1px solid var(--l);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:12.5px;font-weight:bold;margin-bottom:6px;color:var(--t)}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--l);border-radius:8px;font-size:13px;font-family:inherit;background:white}
.field .hint{font-size:11px;color:var(--m);margin-top:4px}
.go{display:block;width:100%;padding:14px;background:var(--a);color:white;border:0;border-radius:24px;font-size:14px;font-weight:bold;cursor:pointer;text-align:center}
.go:hover{background:#e0247a}
.go:disabled{background:var(--ab);cursor:not-allowed}
.preview-outer{display:flex;justify-content:center}
.preview-wrap{width:360px;height:480px;overflow:hidden;position:relative;border-radius:10px;box-shadow:0 4px 20px rgba(23,21,18,.12);background:#fff}
#posterRoot{width:1080px;height:1440px;transform:scale(.33333);transform-origin:top left;position:absolute;top:0;left:0;background:#fff;display:flex;flex-direction:column}
.p-photo{position:relative;flex:1;overflow:hidden;background:#eee}
.p-photo img{width:100%;height:100%;object-fit:cover;display:block}
.p-scrim{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.38) 45%,rgba(0,0,0,0) 100%)}
.p-brand{position:absolute;top:56px;left:72px;display:flex;align-items:center;gap:14px}
.p-brand .bar{width:5px;height:46px;background:#fff;border-radius:2px;flex:none}
.p-brand .names b{display:block;font-size:25px;font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.p-brand .names small{display:block;font-size:14px;letter-spacing:3px;color:#fff;opacity:.9;font-weight:bold}
.p-brand .names em{display:block;font-style:normal;font-size:11px;letter-spacing:1.5px;color:#fff;opacity:.72;font-weight:600;margin-top:4px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.p-text{position:absolute;left:72px;right:72px;bottom:48px}
.p-title{font-size:58px;font-weight:900;color:#fff;line-height:1.2;white-space:pre-wrap;text-shadow:0 4px 16px rgba(0,0,0,.4)}
.p-by{margin-top:14px;font-size:24px;font-weight:600;color:#fff;opacity:.92;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.p-foot{flex:none;padding:30px 72px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eee;background:#fff}
.p-foot .l{font-size:17px;color:var(--m)}
.p-foot .l b{color:var(--a)}
.p-foot .r{display:flex;align-items:center;gap:14px}
.p-foot .r b{font-size:17px;color:var(--a)}
.p-foot .circle{width:38px;height:38px;border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.state{text-align:center;padding:100px 20px;color:var(--m)}
</style></head><body>
<div class="topbar"><a href="index.html">← 갤러리로</a><h1>SNS 이미지 만들기</h1><span style="width:70px"></span></div>
<div id="app"><div class="state">불러오는 중...</div></div>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "gallery-images";
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imageUrl(path){ return supa.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

let ITEM = null;

function fieldsHTML(images){
  const opts = images.map((p,i)=>`<option value="${i}">이미지 ${i+1}</option>`).join("");
  return `
    <div class="field"><label>대표 이미지</label><select id="f_img_main">${opts}</select></div>
    <div class="field"><label>작품명</label><input id="f_title" value="${esc(ITEM.title)}"></div>
    <div class="field"><label>추가 설명 <span style="font-weight:normal;color:var(--m)">(선택)</span></label><input id="f_desc" placeholder="한 줄로 짧게 — 비워두면 표시 안 돼요"></div>
    <div class="field"><label>디자이너 (Design by)</label><input id="f_nick" value="${esc(ITEM.nickname)}"></div>
    <button class="go" id="downloadBtn">⬇️ PNG로 저장</button>
    <p class="hint" style="text-align:center">1080 × 1440px (인스타그램 세로형 3:4)</p>
  `;
}

function render(){
  document.getElementById("app").innerHTML = `
    <div class="layout">
      <div class="panel">${fieldsHTML(ITEM.image_paths)}</div>
      <div class="preview-outer"><div class="preview-wrap"><div id="posterRoot">${posterHTML()}</div></div></div>
    </div>
  `;
  wire();
}

function posterHTML(){
  const img = p => esc(imageUrl(ITEM.image_paths[p]||ITEM.image_paths[0]));
  return `
    <div class="p-photo">
      <img id="o_img_main" src="${img(0)}" crossorigin="anonymous">
      <div class="p-scrim"></div>
      <div class="p-brand"><div class="bar"></div><div class="names"><b>COLOR.M</b><small>AI MAKER GALLERY</small><em>AI-GENERATED IMAGE</em></div></div>
      <div class="p-text">
        <div class="p-title" id="o_title"></div>
        <div class="p-by" id="o_by"></div>
      </div>
    </div>
    <div class="p-foot">
      <div class="l">Made with <b>Product Prompt Maker</b></div>
      <div class="r"><b>COLOR.M MAKER GALLERY</b><div class="circle">→</div></div>
    </div>
  `;
}

function wire(){
  const v = id => document.getElementById(id).value;
  function sync(){
    document.getElementById("o_title").textContent = v("f_title");
    const desc = v("f_desc").trim();
    document.getElementById("o_by").textContent = (desc ? desc + " · " : "") + "Design by " + v("f_nick");
    document.getElementById("o_img_main").src = imageUrl(ITEM.image_paths[v("f_img_main")]);
  }
  ["f_title","f_desc","f_nick","f_img_main"].forEach(id=>document.getElementById(id).addEventListener("input",sync));
  sync();
  document.getElementById("downloadBtn").onclick = download;
}

async function download(){
  const btn = document.getElementById("downloadBtn");
  btn.disabled = true; btn.textContent = "생성 중...";
  const original = document.getElementById("posterRoot");
  const clone = original.cloneNode(true);
  clone.style.transform = "none";
  clone.style.position = "fixed";
  clone.style.top = "0";
  clone.style.left = "-99999px";
  document.body.appendChild(clone);
  try{
    const canvas = await html2canvas(clone, {width:1080, height:1440, scale:1, useCORS:true, backgroundColor:"#ffffff"});
    const link = document.createElement("a");
    link.download = (ITEM.title||"colorm-sns").replace(/[^a-zA-Z0-9가-힣]+/g,"_") + ".png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }catch(e){
    alert("이미지 생성에 실패했어요: " + e.message);
  }finally{
    document.body.removeChild(clone);
    btn.disabled = false; btn.textContent = "⬇️ PNG로 저장";
  }
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  const app = document.getElementById("app");
  if(!id){ app.innerHTML = `<div class="state">작품 id가 없어요. 상세페이지에서 들어와주세요.</div>`; return; }
  const { data, error } = await supa
    .from("submissions")
    .select("id,title,nickname,maker_type,concept,category,tags,image_paths,created_at")
    .eq("id", id)
    .eq("status", "approved")
    .maybeSingle();
  if(error || !data){ app.innerHTML = `<div class="state">작품을 찾을 수 없어요.</div>`; return; }
  ITEM = data;
  render();
})();
</script>
</body></html>

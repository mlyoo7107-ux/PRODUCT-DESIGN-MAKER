<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNS 이미지 만들기 — COLOR.M GALLERY</title>
<link rel="icon" type="image/svg+xml" href="../favicon-gallery.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.topbar{background:white;border-bottom:1px solid var(--l);padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.topbar a{color:var(--m);font-size:13px;font-weight:bold;text-decoration:none}
.topbar a:hover{color:var(--a)}
.topbar h1{font-size:15px;margin:0}
.layout{max-width:1200px;margin:auto;padding:24px 20px 80px;display:grid;grid-template-columns:360px 1fr;gap:28px;align-items:start}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;padding-top:0}
  /* 휴대폰: 미리보기를 입력칸 위에 두고, 스크롤해도 화면 위에 붙어 있게 */
  .preview-outer{order:-1;position:sticky;top:0;z-index:10;background:var(--b);padding:12px 0;margin:0 -20px;box-shadow:0 6px 10px -8px rgba(23,21,18,.25)}
}
.panel{background:white;border:1px solid var(--l);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:12.5px;font-weight:bold;margin-bottom:6px;color:var(--t)}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--l);border-radius:8px;font-size:13px;font-family:inherit;background:white}
.field .hint{font-size:11px;color:var(--m);margin-top:4px}
.go{display:block;width:100%;padding:14px;background:var(--a);color:white;border:0;border-radius:24px;font-size:14px;font-weight:bold;cursor:pointer;text-align:center}
.go:hover{background:#e0247a}
.go:disabled{background:var(--ab);cursor:not-allowed}
.preview-outer{display:flex;justify-content:center}
.preview-wrap{width:360px;overflow:hidden;position:relative;border-radius:10px;box-shadow:0 4px 20px rgba(23,21,18,.12);background:#fff}
/* 저장되는 이미지는 어느 기기에서 만들어도 같은 글꼴로 */
#posterRoot{font-family:"Noto Sans KR",sans-serif;width:1080px;transform:scale(.33333);transform-origin:top left;position:absolute;top:0;left:0;background:#fff;display:flex;flex-direction:column}
.p-photo{position:relative;flex:1;overflow:hidden;background:#eee}
.p-photo img{position:absolute;top:50%;left:50%;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.preview-wrap{cursor:grab;touch-action:none}
.preview-wrap.dragging{cursor:grabbing}
.drag-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:5px 10px;border-radius:12px;pointer-events:none;z-index:5;white-space:nowrap}
.p-scrim{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.38) 45%,rgba(0,0,0,0) 100%)}
.p-brand{position:absolute;top:calc(56px*var(--k,1));left:calc(72px*var(--k,1));display:flex;align-items:center;gap:calc(14px*var(--k,1))}
.p-brand .bar{width:calc(5px*var(--k,1));height:calc(46px*var(--k,1));background:#fff;border-radius:calc(2px*var(--k,1));flex:none}
.p-brand .names b{display:block;font-size:calc(25px*var(--k,1));font-weight:900;color:#fff;text-shadow:0 calc(2px*var(--k,1)) calc(10px*var(--k,1)) rgba(0,0,0,.35)}
.p-brand .names small{display:block;font-size:calc(14px*var(--k,1));letter-spacing:calc(3px*var(--k,1));color:#fff;opacity:.9;font-weight:bold}
.p-brand .names em{display:block;font-style:normal;font-size:calc(11px*var(--k,1));letter-spacing:calc(1.5px*var(--k,1));color:#fff;opacity:.72;font-weight:600;margin-top:calc(4px*var(--k,1));text-shadow:0 calc(2px*var(--k,1)) calc(8px*var(--k,1)) rgba(0,0,0,.35)}
.p-text{position:absolute;left:calc(72px*var(--k,1));right:calc(72px*var(--k,1));bottom:calc(48px*var(--k,1))}
.p-title{font-size:58px;font-weight:900;color:#fff;line-height:1.2;white-space:pre-wrap;text-shadow:0 4px 16px rgba(0,0,0,.4)}
.p-by{margin-top:calc(14px*var(--k,1));font-size:calc(24px*var(--k,1));font-weight:600;color:#fff;opacity:.92;text-shadow:0 calc(2px*var(--k,1)) calc(8px*var(--k,1)) rgba(0,0,0,.35)}
.p-foot{flex:none;padding:calc(30px*var(--k,1)) calc(72px*var(--k,1));display:flex;align-items:center;justify-content:space-between;border-top:calc(1px*var(--k,1)) solid #eee;background:#fff}
.p-foot .l{font-size:calc(17px*var(--k,1));color:var(--m)}
.p-foot .l b{color:var(--a)}
.p-foot .r{display:flex;align-items:center;gap:14px}
.p-foot .r b{font-size:calc(17px*var(--k,1));color:var(--a)}
.p-foot .circle{width:calc(34px*var(--k,1));height:calc(34px*var(--k,1));border-radius:50%;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(16px*var(--k,1));font-weight:900}
.state{text-align:center;padding:100px 20px;color:var(--m)}
.save-ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.save-ov p{margin:0;color:#fff;font-size:15px}
.save-ov img{max-width:100%;max-height:72vh;border-radius:8px;-webkit-touch-callout:default}
.save-ov button{padding:10px 28px;border:0;border-radius:20px;background:#fff;color:var(--t);font-size:14px;font-weight:bold;cursor:pointer}
</style></head><body>
<div class="topbar"><a href="index.html" id="backLink">← 갤러리로</a><h1>SNS 이미지 만들기</h1><span style="width:70px"></span></div>
<div id="app"><div class="state">불러오는 중...</div></div>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "gallery-images";
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imageUrl(path){ return supa.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

let ITEM = null;
const TOOL_NAMES = {
  PRODUCT_DESIGN: "Product Prompt Maker",
  CHARACTER_MAKER: "Character Maker",
  PICTURE_BOOK_MAKER: "Picture Book Maker"
};
const BY_LABELS = {
  PRODUCT_DESIGN: "Design by",
  CHARACTER_MAKER: "Design by",
  PICTURE_BOOK_MAKER: "Story by"
};
let ratioManuallySet = false;
const RATIOS = {
  "4:5": {w:1080,h:1350,label:"4:5 (세로형, 추천)",use:"인스타그램 피드"},
  "3:4": {w:1080,h:1440,label:"3:4 (세로형, 긴)",use:"인스타그램 · 스레드"},
  "1:1": {w:1080,h:1080,label:"1:1 (정사각형)",use:"인스타그램 · 카카오"},
  "16:9": {w:1920,h:1080,label:"16:9 (가로형)",use:"유튜브 · 블로그 · 발표 자료"},
  "1.91:1": {w:1910,h:1000,label:"1.91:1 (가로형, 링크 공유)",use:"페이스북 · 블로그 대표 이미지"}
};

function fieldsHTML(images){
  const opts = images.map((p,i)=>`<option value="${i}">이미지 ${i+1}</option>`).join("");
  const ratioOpts = Object.keys(RATIOS).map(k=>`<option value="${k}">${RATIOS[k].label}</option>`).join("");
  return `
    <div class="field"><label>대표 이미지</label><select id="f_img_main">${opts}</select></div>
    <div class="field"><label>비율</label><select id="f_ratio">${ratioOpts}</select><p class="hint">사진에 맞춰 자동으로 추천하며, 직접 바꿀 수도 있어요</p></div>
    <div class="field"><label>확대</label><input type="range" id="f_zoom" min="100" max="250" value="100" style="width:100%"><p class="hint">미리보기를 드래그하면 위치도 옮길 수 있어요</p></div>
    <div class="field"><label>작품명</label><input id="f_title" value="${esc(ITEM.title)}"></div>
    <div class="field"><label>추가 설명 <span style="font-weight:normal;color:var(--m)">(선택)</span></label><input id="f_desc" placeholder="한 줄로 짧게 — 비워두면 표시 안 돼요"></div>
    <div class="field"><label>제작자 (${esc(BY_LABELS[ITEM.product] || "Design by")})</label><input id="f_nick" value="${esc(ITEM.nickname)}" readonly style="background:#f5f6fa;color:var(--m);cursor:not-allowed"><p class="hint">실제 등록자 닉네임으로 고정돼요</p></div>
    <button class="go" id="downloadBtn">⬇️ PNG로 저장</button>
    <button class="go" id="copyCaptionBtn" style="background:white;color:var(--a);border:1px solid var(--ab)">📋 캡션 복사하기</button>
    <p class="hint" style="text-align:center" id="dimHint"></p>
  `;
}

const PRODUCT_HASHTAGS = {
  PRODUCT_DESIGN: "#제품디자인",
  CHARACTER_MAKER: "#캐릭터디자인",
  PICTURE_BOOK_MAKER: "#AI그림책"
};
function buildCaption(){
  const title = document.getElementById("f_title").value.trim();
  const desc = document.getElementById("f_desc").value.trim();
  const nick = document.getElementById("f_nick").value.trim();
  const byLabel = BY_LABELS[ITEM.product] || "Design by";
  const tagHashtags = (ITEM.tags||[]).map(t => "#" + t.replace(/\s+/g,""));
  const hashtags = [...new Set([...tagHashtags, PRODUCT_HASHTAGS[ITEM.product] || "", "#COLORM", "#AI메이커", "#AIMAKERGALLERY"].filter(Boolean))];
  const lines = [title];
  if(desc) lines.push(desc);
  lines.push("", `${byLabel} ${nick}`, "", hashtags.join(" "));
  return lines.join("\n");
}

function render(){
  document.getElementById("app").innerHTML = `
    <div class="layout">
      <div class="panel">${fieldsHTML(ITEM.image_paths)}</div>
      <div class="preview-outer"><div class="preview-wrap" id="preview-wrap-el"><div class="drag-hint">🖱️ 드래그해서 사진 위치 조정</div><div id="posterRoot">${posterHTML()}</div></div></div>
    </div>
  `;
  wire();
}

function posterHTML(){
  const img = p => esc(imageUrl(ITEM.image_paths[p]||ITEM.image_paths[0]));
  return `
    <div class="p-photo">
      <img id="o_img_main" src="${img(0)}" crossorigin="anonymous">
      <div class="p-scrim"></div>
      <div class="p-brand"><div class="bar"></div><div class="names"><b>COLOR.M</b><small>AI MAKER GALLERY</small><em>AI-GENERATED IMAGE</em></div></div>
      <div class="p-text">
        <div class="p-title" id="o_title"></div>
        <div class="p-by" id="o_by"></div>
      </div>
    </div>
    <div class="p-foot">
      <div class="l">Made with <b>${esc(TOOL_NAMES[ITEM.product] || "Product Prompt Maker")}</b></div>
      <div class="r"><b>COLOR.M MAKER GALLERY</b><div class="circle">M</div></div>
    </div>
  `;
}

let imgView = {zoom:1, panX:0, panY:0, naturalW:0, naturalH:0, baseW:0, baseH:0};

const REF_H = 1350; // 4:5 기준 — 글자 크기가 "정상"으로 보이는 기준 비율
const BASE_TITLE_SIZE = 58, BASE_BY_SIZE = 24;

/* 미리보기 축소 비율 — 세로형은 폭 360px, 가로형은 화면에 맞춰 최대 560px */
let previewScale = 1/3;
function applyRatio(){
  const key = document.getElementById("f_ratio").value;
  const r = RATIOS[key];
  const outer = document.querySelector(".preview-outer");
  const room = (outer.clientWidth || 360) - (getComputedStyle(outer).position === "sticky" ? 32 : 0);
  let viewW = Math.min(r.w > r.h ? 560 : 360, room);
  /* 휴대폰에선 미리보기가 화면 위에 붙어 있으니 높이를 화면의 45% 이하로 — 아래 입력칸이 보이게 */
  if(getComputedStyle(outer).position === "sticky") viewW = Math.min(viewW, window.innerHeight * 0.45 * r.w / r.h);
  previewScale = viewW / r.w;
  const root = document.getElementById("posterRoot");
  root.style.width = r.w + "px";
  root.style.height = r.h + "px";
  root.style.transform = `scale(${previewScale})`;
  const wrap = document.getElementById("preview-wrap-el");
  wrap.style.width = viewW + "px";
  wrap.style.height = (r.h * previewScale) + "px";
  document.getElementById("dimHint").textContent = `${r.w} × ${r.h}px (${r.use})`;
  /* 가로형은 화면이 넓어서 로고·하단 글자·제목을 키움 */
  const wide = r.w > r.h;
  root.style.setProperty("--k", wide ? 1.4 : 1);
  const scale = wide ? 1.05 : r.h / REF_H;
  document.getElementById("o_title").style.fontSize = (BASE_TITLE_SIZE * scale) + "px";
  document.getElementById("o_by").style.fontSize = (BASE_BY_SIZE * scale) + "px";
}

function containerH(){
  return RATIOS[document.getElementById("f_ratio").value].h;
}
function containerW(){
  return RATIOS[document.getElementById("f_ratio").value].w;
}

const TOP_BIAS = 0.6; // 0 = 가운데, 1 = 사진 맨 위에 맞춤
function fitImageToContainer(){
  if(!imgView.naturalW) return;
  const h = containerH();
  const sx = containerW()/imgView.naturalW, sy = h/imgView.naturalH;
  /* 사진과 틀 모양이 비슷하면 15% 더 키워 옮길 여유를 줌. 세로 사진을 가로 틀에 넣을 때처럼
     이미 많이 잘리는 경우엔 더 키우면 얼굴까지 잘려서 키우지 않음 */
  const extra = Math.max(sx, sy) / Math.min(sx, sy) >= 1.15 ? 1 : 1.15;
  const coverScale = Math.max(sx, sy) * extra;
  imgView.baseW = imgView.naturalW * coverScale;
  imgView.baseH = imgView.naturalH * coverScale;
  imgView.zoom = 1; imgView.panX = 0;
  /* 위아래가 잘릴 땐 위쪽을 더 보여줌 — 캐릭터 얼굴은 대개 사진 위쪽에 있음 */
  imgView.panY = Math.max(0, imgView.baseH - h) / 2 * TOP_BIAS;
  document.getElementById("f_zoom").value = 100;
  applyImgTransform();
}

function clampPan(){
  const h = containerH();
  const effW = imgView.baseW * imgView.zoom, effH = imgView.baseH * imgView.zoom;
  const maxPanX = Math.max(0, (effW - containerW()) / 2), maxPanY = Math.max(0, (effH - h) / 2);
  imgView.panX = Math.max(-maxPanX, Math.min(maxPanX, imgView.panX));
  imgView.panY = Math.max(-maxPanY, Math.min(maxPanY, imgView.panY));
}

function applyImgTransform(){
  clampPan();
  const img = document.getElementById("o_img_main");
  const effW = imgView.baseW * imgView.zoom, effH = imgView.baseH * imgView.zoom;
  img.style.width = effW + "px";
  img.style.height = effH + "px";
  img.style.transform = `translate(-50%,-50%) translate(${imgView.panX}px, ${imgView.panY}px)`;
}

function loadImageForEditing(src){
  const probe = new Image();
  probe.onload = () => {
    imgView.naturalW = probe.naturalWidth;
    imgView.naturalH = probe.naturalHeight;
    if(!ratioManuallySet){
      const ar = probe.naturalWidth / probe.naturalHeight;
      const key = ar >= 1.3 ? "16:9" : ar >= 0.95 ? "1:1" : "4:5";
      document.getElementById("f_ratio").value = key;
      applyRatio();
    }
    fitImageToContainer();
  };
  probe.src = src;
}

function wireDrag(){
  const wrap = document.getElementById("preview-wrap-el");

  /* 마우스·터치 공통(Pointer Events) — 한 손가락은 이동, 두 손가락은 확대/축소 */
  const pts = new Map();
  let start = {x:0,y:0}, startPan = {x:0,y:0}, startDist = 0, startZoom = 1;
  function center(){
    let x = 0, y = 0;
    pts.forEach(p => { x += p.x; y += p.y; });
    return {x: x/pts.size, y: y/pts.size};
  }
  function dist(){
    const [a, b] = [...pts.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  /* 손가락 수가 바뀔 때마다 기준점을 다시 잡아야 사진이 튀지 않음 */
  function rebase(){
    start = center();
    startPan = {x:imgView.panX, y:imgView.panY};
    startZoom = imgView.zoom;
    startDist = pts.size >= 2 ? dist() : 0;
  }
  wrap.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    wrap.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    wrap.classList.add("dragging");
    rebase();
    e.preventDefault();
  });
  wrap.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pts.size >= 2 && startDist > 0){
      const z = Math.max(1, Math.min(2.5, startZoom * dist() / startDist));
      imgView.zoom = z;
      document.getElementById("f_zoom").value = Math.round(z * 100);
    }
    const c = center();
    imgView.panX = startPan.x + (c.x - start.x) / previewScale;
    imgView.panY = startPan.y + (c.y - start.y) / previewScale;
    applyImgTransform();
  });
  function end(e){
    if(!pts.delete(e.pointerId)) return;
    if(pts.size) rebase(); else wrap.classList.remove("dragging");
  }
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);
}

function wire(){
  const v = id => document.getElementById(id).value;
  function sync(){
    document.getElementById("o_title").textContent = v("f_title");
    const desc = v("f_desc").trim();
    const byLabel = BY_LABELS[ITEM.product] || "Design by";
    document.getElementById("o_by").textContent = (desc ? desc + " · " : "") + byLabel + " " + v("f_nick");
    return imageUrl(ITEM.image_paths[v("f_img_main")]);
  }
  document.getElementById("f_img_main").addEventListener("input", () => {
    const src = sync();
    document.getElementById("o_img_main").src = src;
    loadImageForEditing(src);
  });
  ["f_title","f_desc","f_nick"].forEach(id=>document.getElementById(id).addEventListener("input",sync));
  document.getElementById("f_ratio").addEventListener("change", () => { ratioManuallySet = true; applyRatio(); fitImageToContainer(); });
  document.getElementById("f_zoom").addEventListener("input", e => { imgView.zoom = Number(e.target.value)/100; applyImgTransform(); });
  const firstSrc = sync();
  document.getElementById("o_img_main").src = firstSrc;
  applyRatio();
  loadImageForEditing(firstSrc);
  wireDrag();
  window.addEventListener("resize", applyRatio); // 화면 폭이 바뀌면 미리보기 크기 다시 맞춤
  document.getElementById("downloadBtn").onclick = download;
  /* 저장 대기 중인 이미지가 있는데 내용을 바꾸면 버려서 옛날 이미지가 저장되지 않게 */
  document.querySelector(".panel").addEventListener("input", clearPending);
  document.querySelector(".panel").addEventListener("change", clearPending);
  document.getElementById("preview-wrap-el").addEventListener("pointerdown", clearPending);
  document.getElementById("copyCaptionBtn").onclick = () => {
    navigator.clipboard.writeText(buildCaption())
      .then(() => alert("캡션이 복사됐어요! 인스타그램 캡션창에 붙여넣어 주세요."))
      .catch(() => alert("복사에 실패했어요."));
  };
}

const SAVE_LABEL = "⬇️ PNG로 저장";
/* 휴대폰(터치 화면)이면 공유 시트로 저장 — 아이폰은 일반 다운로드로는 사진 앱에 저장이 안 됨 */
const IS_TOUCH = matchMedia("(pointer:coarse)").matches;
/* 이미지 만드는 시간이 길면 브라우저가 공유를 막음 → 만든 파일을 들고 있다가 한 번 더 누르면 공유 */
let pendingFile = null;
function clearPending(){
  if(!pendingFile) return;
  pendingFile = null;
  document.getElementById("downloadBtn").textContent = SAVE_LABEL;
}

async function shareFile(file){
  try{
    await navigator.share({files:[file]});
  }catch(e){
    if(e.name === "AbortError") return; // 사용자가 공유 창을 닫음
    if(e.name === "NotAllowedError"){
      pendingFile = file;
      document.getElementById("downloadBtn").textContent = "📲 사진 저장하기 (한 번 더 눌러주세요)";
      return;
    }
    showSaveOverlay(URL.createObjectURL(file));
  }
}

/* 공유도 다운로드도 막힌 곳(카카오톡·인스타그램 앱 안 브라우저 등) — 이미지를 길게 눌러 저장 */
function showSaveOverlay(src){
  const ov = document.createElement("div");
  ov.className = "save-ov";
  ov.innerHTML = `<p>이미지를 <b>길게 눌러</b> 저장해 주세요</p><img src="${src}" alt="SNS 이미지"><button type="button">닫기</button>`;
  ov.querySelector("button").onclick = () => ov.remove();
  document.body.appendChild(ov);
}

/* 글꼴을 다 받기 전에 저장하면 기기 기본 글꼴로 찍힘 — 이미지에 쓰는 굵기·글자를 먼저 받아둠 (최대 3초) */
function posterFontsReady(){
  if(!document.fonts) return Promise.resolve();
  const text = document.getElementById("posterRoot").textContent;
  const loads = [400, 600, 700, 900].map(w => document.fonts.load(`${w} 24px "Noto Sans KR"`, text));
  return Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 3000))]).catch(() => {});
}

async function download(){
  const btn = document.getElementById("downloadBtn");
  if(pendingFile){ const f = pendingFile; clearPending(); return shareFile(f); }
  btn.disabled = true; btn.textContent = "생성 중...";
  await posterFontsReady();
  const r = RATIOS[document.getElementById("f_ratio").value];
  const original = document.getElementById("posterRoot");
  const clone = original.cloneNode(true);
  clone.style.transform = "none";
  clone.style.position = "fixed";
  clone.style.top = "0";
  clone.style.left = "-99999px";
  clone.style.width = r.w + "px";
  clone.style.height = r.h + "px";
  document.body.appendChild(clone);
  try{
    const canvas = await html2canvas(clone, {width:r.w, height:r.h, scale:1, useCORS:true, backgroundColor:"#ffffff"});
    const name = (ITEM.title||"colorm-sns").replace(/[^a-zA-Z0-9가-힣]+/g,"_") + ".png";
    const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
    const file = new File([blob], name, {type:"image/png"});
    btn.disabled = false; btn.textContent = SAVE_LABEL;
    if(IS_TOUCH){
      if(navigator.canShare && navigator.canShare({files:[file]})) await shareFile(file);
      else showSaveOverlay(canvas.toDataURL("image/png"));
    }else{
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.download = name;
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
  }catch(e){
    alert("이미지 생성에 실패했어요: " + e.message);
  }finally{
    document.body.removeChild(clone);
    btn.disabled = false;
    if(!pendingFile) btn.textContent = SAVE_LABEL;
  }
}

(async function(){
  const id = new URLSearchParams(location.search).get("id");
  const app = document.getElementById("app");
  if(!id){ app.innerHTML = `<div class="state">작품 id가 없어요. 상세페이지에서 들어와주세요.</div>`; return; }
  const { data, error } = await supa
    .from("submissions")
    .select("id,title,nickname,maker_type,concept,category,product,tags,image_paths,created_at")
    .eq("id", id)
    .eq("status", "approved")
    .maybeSingle();
  if(error || !data){ app.innerHTML = `<div class="state">작품을 찾을 수 없어요.</div>`; return; }
  ITEM = data;
  /* 작품이 속한 메이커 탭(캐릭터·제품 등)의 갤러리로 돌아가기 */
  if(/^[A-Z_]+$/.test(data.product || "")) document.getElementById("backLink").href = "index.html?product=" + data.product;
  render();
})();
</script>

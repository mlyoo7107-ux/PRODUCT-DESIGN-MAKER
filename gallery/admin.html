<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>갤러리 관리자 — COLOR.M GALLERY</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon-admin.svg">
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.wrap{max-width:720px;margin:auto;padding:24px 20px 60px}
h1{font-size:20px;margin:0 0 18px}
.gate{background:white;border:1px solid var(--l);border-radius:16px;padding:24px;max-width:360px;margin:80px auto}
.gate input{width:100%;padding:11px;border:1px solid #e3ddd0;border-radius:9px;font-size:14px;margin:10px 0}
.gate button{width:100%;padding:12px;background:var(--a);color:white;border:0;border-radius:22px;font-weight:bold;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{padding:9px 14px;border:1px solid var(--l);border-radius:20px;font-size:13px;cursor:pointer;background:white}
.tab.on{background:var(--a);color:white;border-color:var(--a);font-weight:bold}
.item{background:white;border:1px solid var(--l);border-radius:16px;padding:16px;margin-bottom:14px}
.item-row{display:flex;gap:14px}
.thumbs{display:flex;gap:6px;flex:none}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:10px;background:var(--l)}
.info{flex:1;min-width:0}
.info h3{margin:0 0 4px;font-size:15px}
.product-badge{display:inline-block;font-size:10px;font-weight:bold;color:white;padding:2px 8px;border-radius:10px;margin-bottom:4px}
.info p{margin:2px 0;font-size:12px;color:var(--m)}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{padding:8px 14px;border-radius:16px;border:1px solid var(--l);background:white;font-size:12px;font-weight:bold;cursor:pointer}
.btn-approve{color:#1a8a4a;border-color:#1a8a4a}
.btn-reject{color:#b8860b;border-color:#b8860b}
.btn-delete{color:#c0392b;border-color:#c0392b}
.btn-edit{color:var(--a);border-color:var(--a)}
.empty{text-align:center;padding:60px 20px;color:var(--m)}
.edit-form label{font-size:12px;font-weight:bold;display:block;margin:10px 0 4px}
.edit-form input,.edit-form textarea,.edit-form select{width:100%;padding:9px;border:1px solid #e3ddd0;border-radius:8px;font-size:13px;font-family:inherit}
.edit-form textarea{min-height:60px;resize:vertical}
.edit-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;border-radius:12px;transition:background .15s,box-shadow .15s}
.edit-thumbs.drag-over{background:#fff5fa;box-shadow:0 0 0 2px var(--a) inset}
.edit-thumb{position:relative;width:84px;height:84px;cursor:grab}
.edit-thumb.dragging{opacity:.4}
.edit-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;background:var(--l);pointer-events:none}
.edit-thumb .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#c0392b;color:white;border:0;font-size:12px;cursor:pointer;line-height:20px;text-align:center;padding:0}
.edit-thumb .order{position:absolute;bottom:3px;left:3px;background:rgba(23,21,18,.6);color:white;font-size:10px;padding:1px 5px;border-radius:7px}
.edit-thumb .move-row{position:absolute;bottom:3px;right:3px;display:flex;gap:2px}
.edit-thumb .mv{width:18px;height:18px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--t);font-size:10px;cursor:pointer;line-height:18px;text-align:center;padding:0}
.add-photo{width:84px;height:84px;border:1px dashed var(--l);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--m);cursor:pointer}
.req-msg{font-size:14px;margin:6px 0;background:#f5f6fa;border:1px solid var(--l);border-radius:8px;padding:10px}
</style></head><body>
<div class="wrap">
<div id="gate" class="gate">
  <h1 style="text-align:center">관리자 로그인</h1>
  <input type="password" id="pwInput" placeholder="비밀번호">
  <button id="pwBtn">입장</button>
  <p class="msg" id="gateMsg" style="font-size:13px;color:#c0392b;margin-top:8px;display:none"></p>
</div>
<div id="panel" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 style="margin:0">갤러리 관리</h1>
    <div style="display:flex;gap:6px">
      <a href="index.html" target="_blank" style="padding:8px 14px;border-radius:16px;border:1px solid var(--a);background:white;font-size:12px;cursor:pointer;color:var(--a);text-decoration:none">🖼️ 갤러리 보기</a>
      <button id="logoutBtn" style="padding:8px 14px;border-radius:16px;border:1px solid var(--l);background:white;font-size:12px;cursor:pointer;color:var(--m)">로그아웃</button>
    </div>
  </div>
  <div class="tabs" id="statusTabs">
    <div class="tab on" data-tab="pending">승인 대기</div>
    <div class="tab" data-tab="approved">승인됨</div>
    <div class="tab" data-tab="requests">수정 요청</div>
  </div>
  <div class="tabs" id="productFilterTabs" style="margin-top:-6px"></div>
  <div id="list"></div>
</div>
</div>
<script>
const API = "https://colorm-gallery-admin.milan71.workers.dev";
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const PRODUCTS = {
  PRODUCT_DESIGN: { label: "🎨 제품디자인", color: "#ff2d86", categories: ["생활·가전","IT·스마트","가구·공간","헬스·뷰티","모빌리티","키즈·시니어","반려동물","스포츠·아웃도어","산업·공공","기타"] },
  CHARACTER_MAKER: { label: "🧸 캐릭터디자인", color: "#8b5cf6", categories: ["그림책","브랜드·마스코트","굿즈·상품","이모티콘","교육 콘텐츠","SNS 콘텐츠","영상·애니메이션","게임·콘텐츠","기타"] },
  PICTURE_BOOK_MAKER: { label: "📖 AI 그림책", color: "#f97316", categories: ["기타"] }
};
const PRODUCT_ORDER = ["ALL","PRODUCT_DESIGN","CHARACTER_MAKER","PICTURE_BOOK_MAKER"];
const MAX_IMAGES = 5;
let activeProductFilter = "ALL";
function categoriesFor(product){ return (PRODUCTS[product] || PRODUCTS.PRODUCT_DESIGN).categories; }
function productLabel(key){ return (PRODUCTS[key] || {}).label || key || "알 수 없음"; }
function productColor(key){ return (PRODUCTS[key] || {}).color || "#999"; }
function renderProductFilterTabs(){
  const el = document.getElementById("productFilterTabs");
  el.innerHTML = PRODUCT_ORDER.map(key => `<div class="tab${key===activeProductFilter?" on":""}" data-pf="${key}" style="font-size:12px;padding:7px 12px">${key==="ALL"?"전체":productLabel(key)}</div>`).join("");
  el.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => { activeProductFilter = tab.dataset.pf; load(currentTab); };
  });
}
let pw = sessionStorage.getItem("cmGalleryAdminPw") || "";
let currentTab = "pending";

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imageUrl(path){ return `${SUPABASE_URL}/storage/v1/object/public/gallery-images/${path}`; }

async function api(path, opts={}){
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", "x-admin-password": pw, ...(opts.headers||{}) }
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "요청 실패");
  return data;
}

function compressImage(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function blobToBase64(blob){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

function renderItemView(item, tab){
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <div class="item-row">
      <div class="thumbs">${(item.image_paths||[]).slice(0,3).map(p=>`<img src="${esc(imageUrl(p))}">`).join("")}</div>
      <div class="info">
        <span class="product-badge" style="background:${productColor(item.product)}">${esc(productLabel(item.product))}</span>
        <h3>${esc(item.title)}</h3>
        <p>by ${esc(item.nickname)} · ${esc(item.maker_type)} · ${esc(item.category||"")}</p>
        <p>${esc(item.concept||"")}</p>
        <div class="actions">
          ${tab === "pending" ? `<button class="btn-approve">승인</button><button class="btn-reject">거절</button>` : ""}
          <button class="btn-edit">수정</button>
          <button class="btn-delete">삭제</button>
        </div>
      </div>
    </div>
  `;
  const row = div.querySelector(".item-row");
  if(tab === "pending"){
    div.querySelector(".btn-approve").onclick = async () => { await api("/approve", { method:"POST", body: JSON.stringify({ id: item.id }) }); load(currentTab); };
    div.querySelector(".btn-reject").onclick = async () => { await api("/reject", { method:"POST", body: JSON.stringify({ id: item.id }) }); load(currentTab); };
  }
  div.querySelector(".btn-delete").onclick = async () => {
    if(!confirm("정말 삭제할까요? 이미지도 함께 삭제되고 되돌릴 수 없어요.")) return;
    await api("/delete", { method:"POST", body: JSON.stringify({ id: item.id }) });
    load(currentTab);
  };
  div.querySelector(".btn-edit").onclick = () => {
    div.replaceWith(renderItemEdit(item, tab));
  };
  return div;
}

function renderItemEdit(item, tab, onSaved, attachedImagePath){
  const div = document.createElement("div");
  div.className = "item";
  const state = {
    order: [...(item.image_paths||[])].map(p=>({type:"kept",path:p}))
  };
  const catOptions = categoriesFor(item.product).map(c => `<option value="${esc(c)}" ${c===item.category?"selected":""}>${esc(c)}</option>`).join("");
  div.innerHTML = `
    <div class="edit-form">
      <label>작품명</label><input id="f_title" value="${esc(item.title)}">
      <label>닉네임</label><input id="f_nickname" value="${esc(item.nickname)}">
      <label>한 줄 컨셉</label><textarea id="f_concept">${esc(item.concept||"")}</textarea>
      <label>카테고리</label><select id="f_category">${catOptions}</select>
      <label>태그 (쉼표로 구분)</label><input id="f_tags" value="${esc((item.tags||[]).join(", "))}">
      <label>사진 (최대 ${MAX_IMAGES}장, 드래그하거나 화살표로 순서 변경)</label>
      <div class="edit-thumbs" id="editThumbs"></div>
      <input type="file" id="addPhotoInput" accept="image/*" style="display:none">
      <div class="actions" style="margin-top:14px">
        <button class="btn-approve" id="saveBtn">저장</button>
        <button class="btn-delete" id="cancelBtn">취소</button>
      </div>
      <p class="msg" style="font-size:12px;color:#c0392b;display:none" id="editMsg"></p>
    </div>
  `;

  let dragIndex = null;
  function renderThumbs(){
    const box = div.querySelector("#editThumbs");
    box.innerHTML = "";
    state.order.forEach((entry, i) => {
      const t = document.createElement("div");
      t.className = "edit-thumb";
      t.draggable = true;
      const src = entry.type === "kept" ? esc(imageUrl(entry.path)) : URL.createObjectURL(entry.blob);
      t.innerHTML = `
        <img src="${src}">
        <span class="order">${i + 1}</span>
        <button class="x" type="button">×</button>
        <div class="move-row">
          <button type="button" class="mv" data-dir="-1">◀</button>
          <button type="button" class="mv" data-dir="1">▶</button>
        </div>
      `;
      t.querySelector(".x").onclick = () => { state.order.splice(i,1); renderThumbs(); };
      t.querySelectorAll(".mv").forEach(btn => {
        btn.onclick = () => {
          const j = i + parseInt(btn.dataset.dir, 10);
          if(j < 0 || j >= state.order.length) return;
          [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
          renderThumbs();
        };
      });
      t.addEventListener("dragstart", () => { dragIndex = i; t.classList.add("dragging"); });
      t.addEventListener("dragend", () => t.classList.remove("dragging"));
      t.addEventListener("dragover", (e) => e.preventDefault());
      t.addEventListener("drop", (e) => {
        e.preventDefault();
        if(dragIndex === null || dragIndex === i) return;
        const [moved] = state.order.splice(dragIndex, 1);
        state.order.splice(i, 0, moved);
        dragIndex = null;
        renderThumbs();
      });
      box.appendChild(t);
    });
    if(state.order.length < MAX_IMAGES){
      const add = document.createElement("div");
      add.className = "add-photo";
      add.textContent = "+";
      add.onclick = () => div.querySelector("#addPhotoInput").click();
      box.appendChild(add);
    }
  }
  renderThumbs();

  if(attachedImagePath && state.order.length < MAX_IMAGES){
    fetch(imageUrl(attachedImagePath))
      .then(r => r.blob())
      .then(blob => { state.order.push({type:"new",blob}); renderThumbs(); })
      .catch(() => {});
  }

  async function addNewBlobs(fileList){
    const files = Array.from(fileList || []).filter(f => f.type.startsWith("image/"));
    const remaining = MAX_IMAGES - state.order.length;
    for(const f of files.slice(0, remaining)){
      const blob = await compressImage(f);
      state.order.push({type:"new",blob});
    }
    renderThumbs();
  }

  div.querySelector("#addPhotoInput").addEventListener("change", async (ev) => {
    await addNewBlobs(ev.target.files);
    ev.target.value = "";
  });

  const editThumbsEl = div.querySelector("#editThumbs");
  ["dragenter","dragover"].forEach(evt => {
    editThumbsEl.addEventListener(evt, (e) => { e.preventDefault(); editThumbsEl.classList.add("drag-over"); });
  });
  ["dragleave","drop"].forEach(evt => {
    editThumbsEl.addEventListener(evt, (e) => { e.preventDefault(); editThumbsEl.classList.remove("drag-over"); });
  });
  editThumbsEl.addEventListener("drop", async (e) => { await addNewBlobs(e.dataTransfer.files); });

  div.querySelector("#cancelBtn").onclick = () => { div.replaceWith(renderItemView(item, tab)); };

  div.querySelector("#saveBtn").onclick = async () => {
    const btn = div.querySelector("#saveBtn");
    btn.disabled = true; btn.textContent = "저장 중...";
    try {
      const originalPaths = item.image_paths||[];
      const keptOrder = state.order.filter(e=>e.type==="kept").map(e=>e.path);
      const stillKept = originalPaths.filter(p=>keptOrder.includes(p));
      const reordered = JSON.stringify(stillKept) !== JSON.stringify(keptOrder);
      if(reordered){
        // 순서가 바뀐 경우, 기존 이미지를 전부 지우고 화면에 보이는 순서 그대로 다시 올려요
        for(const p of originalPaths){
          await api("/remove-image", { method:"POST", body: JSON.stringify({ id: item.id, path: p }) });
        }
        for(const entry of state.order){
          const blob = entry.type==="kept" ? await fetch(imageUrl(entry.path)).then(r=>r.blob()) : entry.blob;
          const b64 = await blobToBase64(blob);
          await api("/add-image", { method:"POST", body: JSON.stringify({ id: item.id, imageBase64: b64 }) });
        }
      } else {
        const removed = originalPaths.filter(p => !keptOrder.includes(p));
        for(const p of removed){
          await api("/remove-image", { method:"POST", body: JSON.stringify({ id: item.id, path: p }) });
        }
        for(const entry of state.order.filter(e=>e.type==="new")){
          const b64 = await blobToBase64(entry.blob);
          await api("/add-image", { method:"POST", body: JSON.stringify({ id: item.id, imageBase64: b64 }) });
        }
      }
      const tags = div.querySelector("#f_tags").value.split(",").map(t=>t.trim()).filter(Boolean);
      await api("/update", { method:"POST", body: JSON.stringify({
        id: item.id,
        title: div.querySelector("#f_title").value.trim(),
        nickname: div.querySelector("#f_nickname").value.trim(),
        concept: div.querySelector("#f_concept").value.trim(),
        category: div.querySelector("#f_category").value,
        tags,
        maker_type: item.maker_type
      })});
      if(onSaved) await onSaved();
      load(currentTab);
    } catch(e){
      const m = div.querySelector("#editMsg");
      m.textContent = e.message;
      m.style.display = "block";
      btn.disabled = false; btn.textContent = "저장";
    }
  };

  return div;
}

function renderRequest(req){
  const div = document.createElement("div");
  div.className = "item";
  const sub = req.submissions || {};
  div.innerHTML = `
    <h3 style="margin:0 0 4px;font-size:15px">${esc(sub.title || "(삭제된 작품)")}</h3>
    <p style="margin:2px 0;font-size:12px;color:var(--m)">by ${esc(sub.nickname||"")} · 요청일 ${new Date(req.created_at).toLocaleDateString()}</p>
    <div class="req-msg">${esc(req.message)}</div>
    ${req.image_path ? `<p style="margin:8px 0 4px;font-size:12px;font-weight:bold">📎 요청자가 첨부한 새 사진</p><img src="${esc(imageUrl(req.image_path))}" style="width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--l)">` : ""}
    ${req.contact ? `<p style="margin:8px 0 0;font-size:12px;color:var(--m)">연락처: ${esc(req.contact)}</p>` : ""}
    <div class="actions">
      ${sub.id ? `<button class="btn-edit">✏️ 이 작품 수정하기</button>` : ""}
      <button class="btn-approve">완료 처리</button>
      <button class="btn-delete">삭제</button>
    </div>
  `;
  if(sub.id){
    div.querySelector(".btn-edit").onclick = () => {
      div.replaceWith(renderItemEdit(sub, sub.status, () => api("/requests/done", { method:"POST", body: JSON.stringify({ id: req.id }) }), req.image_path));
    };
  }
  div.querySelector(".btn-approve").onclick = async () => {
    if(!confirm("정말 완료 처리할까요?\n완료 처리만으로는 작품 내용이 바뀌지 않아요 — 먼저 '이 작품 수정하기'로 실제 내용을 고치셨는지 확인해주세요.")) return;
    await api("/requests/done", { method:"POST", body: JSON.stringify({ id: req.id }) }); load(currentTab);
  };
  div.querySelector(".btn-delete").onclick = async () => {
    if(!confirm("삭제할까요?")) return;
    await api("/requests/delete", { method:"POST", body: JSON.stringify({ id: req.id }) });
    load(currentTab);
  };
  return div;
}

async function load(tab){
  currentTab = tab;
  document.querySelectorAll("#statusTabs .tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  renderProductFilterTabs();
  const list = document.getElementById("list");
  list.innerHTML = `<div class="empty">불러오는 중...</div>`;
  try {
    if(tab === "requests"){
      let items = await api("/requests");
      if(activeProductFilter !== "ALL") items = items.filter(r => (r.submissions||{}).product === activeProductFilter);
      if(!items.length){ list.innerHTML = `<div class="empty">수정 요청이 없어요.</div>`; return; }
      list.innerHTML = "";
      items.forEach(r => list.appendChild(renderRequest(r)));
      return;
    }
    let items = await api(tab === "pending" ? "/pending" : "/approved");
    if(activeProductFilter !== "ALL") items = items.filter(item => item.product === activeProductFilter);
    if(!items.length){
      list.innerHTML = `<div class="empty">${tab === "pending" ? "승인 대기중인 작품이 없어요." : "승인된 작품이 없어요."}</div>`;
      return;
    }
    list.innerHTML = "";
    items.forEach(item => list.appendChild(renderItemView(item, tab)));
  } catch(e){
    list.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => load(t.dataset.tab));

document.getElementById("pwBtn").onclick = async () => {
  pw = document.getElementById("pwInput").value;
  try {
    await api("/pending");
    sessionStorage.setItem("cmGalleryAdminPw", pw);
    document.getElementById("gate").style.display = "none";
    document.getElementById("panel").style.display = "block";
    load("pending");
  } catch(e){
    document.getElementById("gateMsg").textContent = "비밀번호가 틀렸어요.";
    document.getElementById("gateMsg").style.display = "block";
  }
};

document.getElementById("logoutBtn").onclick = () => {
  sessionStorage.removeItem("cmGalleryAdminPw");
  location.reload();
};

if(pw){
  document.getElementById("gate").style.display = "none";
  document.getElementById("panel").style.display = "block";
  load("pending");
}
</script>
</body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수정 요청 — COLOR.M GALLERY</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.wrap{max-width:480px;margin:auto;padding:0 20px}
header{text-align:center;padding:36px 20px 20px}
header small{color:var(--a);font-weight:bold;letter-spacing:2px}
header h1{margin:8px 0;font-size:21px;font-weight:900}
header p{color:var(--m);margin:0;font-size:14px}
.card{background:white;border:1px solid var(--l);border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 2px 8px rgba(23,21,18,.05)}
label{font-size:13px;font-weight:bold;display:block;margin:16px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;padding:11px;border:1px solid #e3ddd0;border-radius:9px;font-size:14px;font-family:inherit}
textarea{min-height:100px;resize:vertical}
.hint{font-size:12px;color:var(--m);margin:4px 0 0}
.go{width:100%;padding:16px;background:var(--a);color:white;border:0;border-radius:28px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
.go:hover{background:#e0247a}
.go:disabled{background:var(--ab);cursor:not-allowed}
.go:disabled:hover{background:var(--a)}
.back{display:block;text-align:center;margin-top:14px;color:var(--m);font-size:13px;text-decoration:none}
.msg{font-size:13px;color:#c0392b;margin-top:10px;display:none}
.success{text-align:center;padding:40px 10px}
.success .icon{font-size:44px}
footer{text-align:center;padding:36px 15px 44px;border-top:1px solid var(--l)}
footer p{margin:12px 0 0;font-size:12px;color:var(--m)}
footer a{color:var(--m)}
footer img{max-width:120px;opacity:.85}
</style></head><body>
<div class="wrap">
<header>
<small>COLOR.M · GALLERY</small>
<h1>작품 수정 요청</h1>
<p id="targetTitle">어떤 부분을 수정하고 싶으신지 알려주세요.</p>
</header>

<div class="card" id="formCard">
<form id="reqForm">
<label>수정 요청 내용 *</label>
<textarea id="message" placeholder="예: 사진을 새로 바꾸고 싶어요 / 작품명을 다르게 고치고 싶어요" required maxlength="500"></textarea>

<label>새 사진으로 바꾸고 싶다면 첨부해주세요 (선택)</label>
<input type="file" id="newImage" accept="image/*">
<img id="newImagePreview" style="display:none;max-width:100%;border-radius:10px;margin-top:8px">
<p class="hint">사진 교체를 요청하시는 경우에만 첨부해주세요.</p>

<label>연락처 (선택)</label>
<input type="text" id="contact" placeholder="답변 받으실 이메일, 카카오톡 ID 등">
<p class="hint">확인 후 반영해드릴게요. 연락처를 남기시면 처리 결과를 알려드릴 수 있어요.</p>

<p class="msg" id="errMsg"></p>
<button type="submit" class="go" id="submitBtn">요청 보내기</button>
</form>
<a class="back" id="backLink" href="index.html">← 갤러리로 돌아가기</a>
</div>

<div class="card success" id="successCard" style="display:none">
<div class="icon">✅</div>
<h2 style="margin:12px 0 8px">요청이 접수됐어요!</h2>
<p style="color:var(--m);font-size:14px">확인 후 반영해드릴게요.</p>
<a class="go" href="index.html" style="display:block;text-decoration:none;margin-top:20px">갤러리로 가기 →</a>
</div>
</div>
<footer><img src="../logo-colorm.png" alt="COLOR.M"><p>© 2026 COLOR.M · <a href="https://colorm.net" target="_blank" rel="noopener">colorm.net</a></p></footer>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const submissionId = params.get("id");
const title = params.get("title");
if(title) document.getElementById("targetTitle").textContent = `"${title}" 작품에 대한 요청이에요.`;
document.getElementById("backLink").href = submissionId ? `detail.html?id=${submissionId}` : "index.html";

function showError(msg){
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.style.display = "block";
}

function compressImage(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let newImageBlob = null;
document.getElementById("newImage").addEventListener("change", async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  newImageBlob = await compressImage(f);
  const preview = document.getElementById("newImagePreview");
  preview.src = URL.createObjectURL(newImageBlob);
  preview.style.display = "block";
});

document.getElementById("reqForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  document.getElementById("errMsg").style.display = "none";
  if(!submissionId) return showError("어떤 작품인지 확인할 수 없어요. 작품 상세페이지에서 다시 들어와주세요.");

  const message = document.getElementById("message").value.trim();
  const contact = document.getElementById("contact").value.trim();
  if(!message) return showError("수정 요청 내용을 입력해주세요.");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "보내는 중...";

  let imagePath = null;
  if(newImageBlob){
    imagePath = `request-${Date.now()}-${Math.random().toString(36).slice(2, 10)}.jpg`;
    const { error: uploadErr } = await supa.storage.from("gallery-images").upload(imagePath, newImageBlob, {
      contentType: "image/jpeg",
      upsert: false
    });
    if(uploadErr){
      console.error(uploadErr);
      showError("사진 업로드 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.");
      btn.disabled = false; btn.textContent = "요청 보내기";
      return;
    }
  }

  const { error } = await supa.from("edit_requests").insert({
    submission_id: submissionId, message, contact, image_path: imagePath
  });

  if(error){
    console.error(error);
    showError("요청 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.");
    btn.disabled = false; btn.textContent = "요청 보내기";
    return;
  }

  document.getElementById("formCard").style.display = "none";
  document.getElementById("successCard").style.display = "block";
});
</script>
</body></html>

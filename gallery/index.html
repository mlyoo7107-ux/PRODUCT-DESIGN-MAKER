<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COLOR.M MAKER GALLERY</title>
<meta name="description" content="COLOR.M Product Design Maker로 만든 작품들을 모아보는 갤러리입니다.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery/index.html">
<meta property="og:title" content="COLOR.M MAKER GALLERY">
<meta property="og:description" content="COLOR.M Product Design Maker로 만든 작품들을 구경해보세요.">
<meta property="og:image" content="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery-kakao-thumb.webp">
<meta property="og:image:alt" content="COLOR.M MAKER GALLERY">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="COLOR.M MAKER GALLERY">
<meta name="twitter:description" content="COLOR.M Product Design Maker로 만든 작품들을 구경해보세요.">
<meta name="twitter:image" content="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery-kakao-thumb.webp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;max-width:100%;overflow:visible;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.top-bar{position:sticky;top:0;z-index:41;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--l)}
.top-bar-brand{display:flex;align-items:center;gap:14px}
.top-bar-right{display:flex;align-items:center;gap:14px}
.home-badge{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--a)}
.home-badge:hover{background:#e0247a}
.top-logo{height:40px;width:auto;display:block}
.app-name{color:#df79a4;font-size:12px;font-weight:800;letter-spacing:.15em;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:14px}
.top-actions a.btn{font-size:12.5px;color:var(--m);text-decoration:none;font-weight:bold}
.top-actions a.btn:hover{color:var(--a)}
.top-actions a.btn.primary{background:var(--a);color:white;padding:7px 14px;border-radius:16px}
.top-actions a.btn.primary:hover{background:#e0247a;color:white}
.top-actions span.btn{font-size:12.5px;color:var(--m);font-weight:bold;opacity:.6}
@media(max-width:640px){.top-bar{padding:10px 16px}.top-logo{height:32px}.app-name{display:none}.top-actions{display:none}main{padding-top:0}}
main{max-width:1100px;margin:auto;padding:20px 15px 60px}
.bottom-nav{display:none}
@media(max-width:640px){
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--l);padding:8px 10px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .bottom-nav a,.bottom-nav span{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--m);font-size:10.5px;font-weight:bold;flex:1;min-width:0;cursor:pointer}
  .bottom-nav a span:last-child,.bottom-nav span span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bottom-nav .icon{font-size:20px}
  .bottom-nav a:hover,.bottom-nav a.active{color:var(--a)}
  main{padding-bottom:84px}
  footer{padding-bottom:84px}
}
.filters-wrap{position:sticky;top:var(--topbar-h,64px);z-index:10;background:var(--b);padding:8px 0;max-height:160px;overflow:hidden;transition:max-height .25s ease,padding .25s ease}
.filters-wrap.collapsed{max-height:0;padding:0 0}
.product-tabs{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.product-tabs::-webkit-scrollbar{display:none}
.product-tab{flex:none}
.product-tab{padding:9px 16px;border:1px solid var(--l);border-radius:20px;font-size:13.5px;font-weight:bold;cursor:pointer;background:white;transition:background .15s,border-color .15s,color .15s}
.product-tab:hover{border-color:var(--a);color:var(--a)}
.product-tab.on{background:var(--t);border-color:var(--t);color:white}
.filters-row{display:flex;align-items:center;gap:8px}
.filters{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin:0;flex:1;min-width:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 14px;border:1px solid var(--l);border-radius:20px;font-size:13px;cursor:pointer;background:white;transition:background .15s,border-color .15s,color .15s;flex:none;white-space:nowrap}
.filter-chip:hover{border-color:var(--a);color:var(--a)}
.filter-chip.on{background:var(--a);border-color:var(--a);color:white;font-weight:bold}
.empty .soon{display:block;font-size:13px;margin-top:8px;color:var(--ab)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card-wrap{position:relative;min-width:0;max-width:100%}
.card{background:white;border:1px solid var(--l);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--t);display:block;box-shadow:0 2px 8px rgba(23,21,18,.05);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.share-fab{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(23,21,18,.55);color:white;border:0;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;z-index:2}
.share-fab:hover{background:var(--a)}
.card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--l);display:block}
.card .body{padding:12px 14px}
.card .maker-badge{display:inline-block;font-size:10px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.card .maker-badge.basic{background:#eee;color:var(--m)}
.card .maker-badge.pro{background:var(--a);color:white}
.card .title{font-size:15px;font-weight:bold;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nick{font-size:12px;color:var(--m);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view-toggle{display:none}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px}
  .card .body{padding:8px 9px}
  .card .maker-badge{font-size:9px;padding:1px 6px;margin-bottom:4px}
  .card .title{font-size:12.5px;margin:0 0 2px}
  .share-fab{width:26px;height:26px;font-size:12px;top:6px;right:6px}
  .card .nick{font-size:10.5px}
  .view-toggle{display:flex;flex:none;gap:6px}
  .view-toggle button{width:38px;height:38px;border-radius:10px;border:1px solid var(--l);background:white;font-size:17px;line-height:1;cursor:pointer;color:var(--m)}
  .view-toggle button.on{background:var(--t);color:white;border-color:var(--t)}
  .grid.list-view{grid-template-columns:minmax(0,1fr) !important}
  .grid.list-view .card .body{padding:12px 14px}
  .grid.list-view .card .maker-badge{font-size:10px;padding:2px 8px;margin-bottom:6px}
  .grid.list-view .card .title{font-size:15px;margin:0 0 4px}
  .grid.list-view .card .nick{font-size:12px}
  .grid.list-view .share-fab{width:32px;height:32px;font-size:15px;top:8px;right:8px}
}
.empty{text-align:center;padding:80px 20px;color:var(--m)}
.loading{text-align:center;padding:80px 20px;color:var(--m)}
footer{text-align:center;padding:36px 15px 44px;border-top:1px solid var(--l)}
footer img{max-width:120px;opacity:.85}
footer p{margin:12px 0 0;font-size:12px;color:var(--m)}
footer a{color:var(--m)}
</style></head><body>
<header class="top-bar">
<div class="top-bar-brand"><img src="../logo-colorm.png" alt="COLOR.M" class="top-logo"><span class="app-name">AI MAKER GALLERY</span></div>
<div class="top-bar-right">
<div class="top-actions" id="topActions"></div>
<a class="home-badge" href="https://colorm.net" target="_blank" rel="noopener" aria-label="홈페이지"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/></svg></a>
</div>
</header>
<main>
<div class="filters-wrap">
<div class="product-tabs" id="productTabs"></div>
<div class="filters-row">
<div class="filters" id="filters"></div>
<div class="view-toggle" id="viewToggle">
<button type="button" data-v="2" aria-label="2열 보기">⊞</button>
<button type="button" data-v="1" aria-label="1열 보기">☰</button>
</div>
</div>
</div>
<div id="content"><div class="loading">불러오는 중...</div></div>
</main>
<footer><img src="../logo-colorm.png" alt="COLOR.M"><p>© 2026 COLOR.M · <a href="https://colorm.net" target="_blank" rel="noopener">colorm.net</a></p></footer>
<nav class="bottom-nav" id="bottomNav"></nav>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "gallery-images";

const PRODUCTS = {
  PRODUCT_DESIGN: {
    label: "🎨 제품디자인", makerUrl: "../index.html",
    categories: ["생활·가전","IT·스마트","가구·공간","헬스·뷰티","모빌리티","키즈·시니어","반려동물","스포츠·아웃도어","산업·공공","기타"]
  },
  CHARACTER_MAKER: {
    label: "🧸 캐릭터디자인", makerUrl: null,
    categories: ["그림책","브랜드·마스코트","굿즈·상품","이모티콘","교육 콘텐츠","SNS 콘텐츠","영상·애니메이션","게임·콘텐츠","기타"]
  },
  PICTURE_BOOK_MAKER: {
    label: "📖 AI 그림책", makerUrl: null,
    categories: ["기타"]
  }
};
const PRODUCT_ORDER = ["PRODUCT_DESIGN","CHARACTER_MAKER","PICTURE_BOOK_MAKER"];

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imageUrl(path){ return supa.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

let allItems = [];
let activeProduct = "PRODUCT_DESIGN";
let activeCategory = "전체";
let viewMode = "2";
try{ viewMode = localStorage.getItem("galleryView") || "2"; }catch(e){}

function initViewToggle(){
  const toggle = document.getElementById("viewToggle");
  if(!toggle) return;
  toggle.querySelectorAll("button").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.v === viewMode);
    btn.onclick = () => {
      viewMode = btn.dataset.v;
      toggle.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === viewMode));
      try{ localStorage.setItem("galleryView", viewMode); }catch(e){}
      renderGrid();
    };
  });
}

function renderTopActions(){
  const p = PRODUCTS[activeProduct];
  const el = document.getElementById("topActions");
  el.innerHTML = `
    ${p.makerUrl ? `<a class="btn" href="${p.makerUrl}">Maker로 가기</a>` : `<span class="btn" style="cursor:default">Maker 준비 중</span>`}
    <a class="btn primary" href="upload.html?product=${activeProduct}">✨ 내 작품 자랑하기</a>
  `;
  renderBottomNav();
}

function renderBottomNav(){
  const p = PRODUCTS[activeProduct];
  const el = document.getElementById("bottomNav");
  if(!el) return;
  el.innerHTML = `
    <a href="javascript:void(0)" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span class="icon" style="font-weight:900;font-size:22px">⬆︎</span><span>맨 위로</span></a>
    <a href="index.html"><span class="icon">🖼️</span><span>갤러리</span></a>
    ${p.makerUrl ? `<a href="${p.makerUrl}"><span class="icon">🎨</span><span>메이커</span></a>` : `<span style="opacity:.5"><span class="icon">🎨</span><span>준비 중</span></span>`}
    <a href="upload.html?product=${activeProduct}"><span class="icon">✨</span><span>자랑하기</span></a>
  `;
}

function renderProductTabs(){
  const el = document.getElementById("productTabs");
  el.innerHTML = PRODUCT_ORDER.map(key => `<div class="product-tab${key===activeProduct?" on":""}" data-p="${key}">${PRODUCTS[key].label}</div>`).join("");
  el.querySelectorAll(".product-tab").forEach(tab => {
    tab.onclick = () => {
      activeProduct = tab.dataset.p;
      activeCategory = "전체";
      renderProductTabs(); renderTopActions(); renderFilters(); renderGrid();
    };
  });
}

function renderFilters(){
  const el = document.getElementById("filters");
  const cats = ["전체", ...PRODUCTS[activeProduct].categories];
  el.innerHTML = cats.map(c => `<div class="filter-chip${c===activeCategory?" on":""}" data-c="${esc(c)}">${esc(c)}</div>`).join("");
  el.querySelectorAll(".filter-chip").forEach(chip => {
    chip.onclick = () => { activeCategory = chip.dataset.c; renderFilters(); renderGrid(); };
  });
}

function renderGrid(){
  const content = document.getElementById("content");
  let items = allItems.filter(x => x.product === activeProduct);
  if(activeCategory !== "전체") items = items.filter(x => x.category === activeCategory);
  if(items.length === 0){
    const soon = !PRODUCTS[activeProduct].makerUrl ? `<span class="soon">${PRODUCTS[activeProduct].label} Maker는 곧 만나보실 수 있어요!</span>` : "";
    content.innerHTML = `<div class="empty">아직 등록된 작품이 없어요.<br>가장 먼저 작품을 올려보세요!${soon}</div>`;
    return;
  }
  content.innerHTML = `<div class="grid${viewMode==='1' ? ' list-view' : ''}">${items.map(item => `
    <div class="card-wrap">
      <a class="card" href="detail.html?id=${esc(item.id)}">
        <img class="thumb" src="${esc(imageUrl(item.image_paths[0]))}" alt="${esc(item.title)}" loading="lazy">
        <div class="body">
          <span class="maker-badge ${item.maker_type==='PRO'?'pro':'basic'}">${esc(item.maker_type)}</span>
          <p class="title">${esc(item.title)}</p>
          <p class="nick">by ${esc(item.nickname)}</p>
        </div>
      </a>
      <button class="share-fab" data-id="${esc(item.id)}" data-title="${esc(item.title)}" aria-label="공유하기">🔗</button>
    </div>
  `).join("")}</div>`;
  content.querySelectorAll(".share-fab").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      shareItem(btn.dataset.id, btn.dataset.title);
    });
  });
}

function shareItem(id, title){
  const url = new URL("detail.html?id=" + encodeURIComponent(id), location.href).href;
  if(navigator.share){
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url)
      .then(() => alert("링크가 복사됐어요! 다른 사람에게 붙여넣어 보내보세요."))
      .catch(() => alert("복사에 실패했어요. 주소를 직접 선택해서 복사해주세요."));
  }
}

async function load(){
  const { data, error } = await supa
    .from("submissions")
    .select("id,title,nickname,maker_type,category,product,image_paths,created_at")
    .eq("status", "approved")
    .order("created_at", { ascending: false });
  if(error){
    document.getElementById("content").innerHTML = `<div class="empty">불러오는 중 문제가 발생했어요.</div>`;
    console.error(error);
    return;
  }
  allItems = data || [];
  renderProductTabs();
  renderTopActions();
  renderFilters();
  initViewToggle();
  renderGrid();
}
load();

function syncTopbarHeight(){
  const tb = document.querySelector(".top-bar");
  if(tb) document.documentElement.style.setProperty("--topbar-h", tb.offsetHeight + "px");
}
window.addEventListener("resize", syncTopbarHeight);
syncTopbarHeight();
setTimeout(syncTopbarHeight, 300);

// 인스타그램처럼: 아래로 스크롤하면(피드를 더 볼 때) 필터 숨김, 위로 스크롤하면(되돌아갈 때) 다시 표시
// (스크롤 노이즈로 인한 떨림 방지: 누적 이동량 임계치 + 전환 중 잠금)
let lastScrollY = window.scrollY;
let scrollTicking = false;
let scrollAccum = 0;
let filtersLocked = false;
const FILTERS_THRESHOLD = 12;
function lockFilters(){
  filtersLocked = true;
  setTimeout(() => { filtersLocked = false; }, 300);
}
function onFiltersScroll(){
  const currentY = window.scrollY;
  const wrap = document.querySelector(".filters-wrap");
  if(window.innerWidth > 640){
    if(wrap && wrap.classList.contains("collapsed")) wrap.classList.remove("collapsed");
    lastScrollY = currentY;
    scrollTicking = false;
    return;
  }
  const diff = currentY - lastScrollY;
  if(wrap && !filtersLocked){
    if(currentY <= 80){
      if(wrap.classList.contains("collapsed")){ wrap.classList.remove("collapsed"); lockFilters(); }
      scrollAccum = 0;
    } else {
      if((diff > 0 && scrollAccum < 0) || (diff < 0 && scrollAccum > 0)) scrollAccum = 0;
      scrollAccum += diff;
      if(scrollAccum > FILTERS_THRESHOLD && !wrap.classList.contains("collapsed")){
        wrap.classList.add("collapsed");
        scrollAccum = 0;
        lockFilters();
      } else if(scrollAccum < -FILTERS_THRESHOLD && wrap.classList.contains("collapsed")){
        wrap.classList.remove("collapsed");
        scrollAccum = 0;
        lockFilters();
      }
    }
  }
  lastScrollY = currentY;
  scrollTicking = false;
}
window.addEventListener("scroll", () => {
  if(!scrollTicking){ requestAnimationFrame(onFiltersScroll); scrollTicking = true; }
}, {passive:true});
</script>
</body></html>

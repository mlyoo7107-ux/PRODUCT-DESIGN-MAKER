<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLOR.M MAKER GALLERY</title>
<meta name="description" content="COLOR.M Product Design Maker로 만든 작품들을 모아보는 갤러리입니다.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery/index.html">
<meta property="og:title" content="COLOR.M MAKER GALLERY">
<meta property="og:description" content="COLOR.M Product Design Maker로 만든 작품들을 구경해보세요.">
<meta property="og:image" content="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery-kakao-thumb.webp">
<meta property="og:image:alt" content="COLOR.M MAKER GALLERY">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="COLOR.M MAKER GALLERY">
<meta name="twitter:description" content="COLOR.M Product Design Maker로 만든 작품들을 구경해보세요.">
<meta name="twitter:image" content="https://mlyoo7107-ux.github.io/PRODUCT-DESIGN-MAKER/gallery-kakao-thumb.webp">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
header{text-align:center;background:white;padding:32px 15px;border-bottom:1px solid var(--l)}
header small{color:var(--a);font-weight:bold;letter-spacing:2px}
header h1{margin:7px 0;font-size:26px;font-weight:900}
header p{color:var(--m);margin:0;font-size:14px}
.top-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:24px;font-size:13px;font-weight:bold;text-decoration:none;cursor:pointer;border:1px solid var(--l);background:white;color:var(--t)}
.btn.primary{background:var(--a);color:white;border-color:var(--a)}
.btn.primary:hover{background:#e0247a}
.btn.outline{color:var(--a);border-color:var(--a)}
.btn.outline:hover{background:#ffe6f1}
main{max-width:1100px;margin:auto;padding:20px 15px 60px}
.filters-wrap{position:sticky;top:0;z-index:10;background:var(--b);padding:14px 0;margin-top:-14px}
.product-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.product-tab{padding:9px 16px;border:1px solid var(--l);border-radius:20px;font-size:13.5px;font-weight:bold;cursor:pointer;background:white;transition:background .15s,border-color .15s,color .15s}
.product-tab:hover{border-color:var(--a);color:var(--a)}
.product-tab.on{background:var(--t);border-color:var(--t);color:white}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0}
.filter-chip{padding:8px 14px;border:1px solid var(--l);border-radius:20px;font-size:13px;cursor:pointer;background:white;transition:background .15s,border-color .15s,color .15s}
.filter-chip:hover{border-color:var(--a);color:var(--a)}
.filter-chip.on{background:var(--a);border-color:var(--a);color:white;font-weight:bold}
.empty .soon{display:block;font-size:13px;margin-top:8px;color:var(--ab)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:white;border:1px solid var(--l);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--t);display:block;box-shadow:0 2px 8px rgba(23,21,18,.05);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .thumb{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--l);display:block}
.card .body{padding:12px 14px}
.card .maker-badge{display:inline-block;font-size:10px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.card .maker-badge.basic{background:#eee;color:var(--m)}
.card .maker-badge.pro{background:var(--a);color:white}
.card .title{font-size:15px;font-weight:bold;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nick{font-size:12px;color:var(--m);margin:0}
.empty{text-align:center;padding:80px 20px;color:var(--m)}
.loading{text-align:center;padding:80px 20px;color:var(--m)}
footer{text-align:center;padding:36px 15px 44px;border-top:1px solid var(--l)}
footer img{max-width:120px;opacity:.85}
footer p{margin:12px 0 0;font-size:12px;color:var(--m)}
footer a{color:var(--m)}
</style></head><body>
<header>
<small>COLOR.M · GALLERY</small>
<h1>MAKER GALLERY</h1>
<p>COLOR.M Product Design Maker로 만든 작품들을 구경해보세요.</p>
<div class="top-actions" id="topActions"></div>
</header>
<main>
<div class="filters-wrap">
<div class="product-tabs" id="productTabs"></div>
<div class="filters" id="filters"></div>
</div>
<div id="content"><div class="loading">불러오는 중...</div></div>
</main>
<footer><img src="../logo-colorm.png" alt="COLOR.M"><p>© 2026 COLOR.M · <a href="https://colorm.net" target="_blank" rel="noopener">colorm.net</a></p></footer>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "gallery-images";

const PRODUCTS = {
  PRODUCT_DESIGN: {
    label: "🎨 제품디자인", makerUrl: "../index.html",
    categories: ["생활·가전","IT·스마트","가구·공간","헬스·뷰티","모빌리티","키즈·시니어","반려동물","스포츠·아웃도어","산업·공공","기타"]
  },
  CHARACTER_MAKER: {
    label: "🧸 캐릭터", makerUrl: null,
    categories: ["동물","인물","판타지","오브젝트","브랜드·마스코트","기타"]
  }
};
const PRODUCT_ORDER = ["PRODUCT_DESIGN","CHARACTER_MAKER"];

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function imageUrl(path){ return supa.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }

let allItems = [];
let activeProduct = "PRODUCT_DESIGN";
let activeCategory = "전체";

function renderTopActions(){
  const p = PRODUCTS[activeProduct];
  const el = document.getElementById("topActions");
  el.innerHTML = `
    <a class="btn primary" href="upload.html">✨ 내 작품 자랑하기</a>
    ${p.makerUrl ? `<a class="btn outline" href="${p.makerUrl}">Maker로 가기 →</a>` : `<span class="btn outline" style="opacity:.5;cursor:default">Maker 준비 중</span>`}
  `;
}

function renderProductTabs(){
  const el = document.getElementById("productTabs");
  el.innerHTML = PRODUCT_ORDER.map(key => `<div class="product-tab${key===activeProduct?" on":""}" data-p="${key}">${PRODUCTS[key].label}</div>`).join("");
  el.querySelectorAll(".product-tab").forEach(tab => {
    tab.onclick = () => {
      activeProduct = tab.dataset.p;
      activeCategory = "전체";
      renderProductTabs(); renderTopActions(); renderFilters(); renderGrid();
    };
  });
}

function renderFilters(){
  const el = document.getElementById("filters");
  const cats = ["전체", ...PRODUCTS[activeProduct].categories];
  el.innerHTML = cats.map(c => `<div class="filter-chip${c===activeCategory?" on":""}" data-c="${esc(c)}">${esc(c)}</div>`).join("");
  el.querySelectorAll(".filter-chip").forEach(chip => {
    chip.onclick = () => { activeCategory = chip.dataset.c; renderFilters(); renderGrid(); };
  });
}

function renderGrid(){
  const content = document.getElementById("content");
  let items = allItems.filter(x => x.product === activeProduct);
  if(activeCategory !== "전체") items = items.filter(x => x.category === activeCategory);
  if(items.length === 0){
    const soon = !PRODUCTS[activeProduct].makerUrl ? `<span class="soon">${PRODUCTS[activeProduct].label} Maker는 곧 만나보실 수 있어요!</span>` : "";
    content.innerHTML = `<div class="empty">아직 등록된 작품이 없어요.<br>가장 먼저 작품을 올려보세요!${soon}</div>`;
    return;
  }
  content.innerHTML = `<div class="grid">${items.map(item => `
    <a class="card" href="detail.html?id=${esc(item.id)}">
      <img class="thumb" src="${esc(imageUrl(item.image_paths[0]))}" alt="${esc(item.title)}" loading="lazy">
      <div class="body">
        <span class="maker-badge ${item.maker_type==='PRO'?'pro':'basic'}">${esc(item.maker_type)}</span>
        <p class="title">${esc(item.title)}</p>
        <p class="nick">by ${esc(item.nickname)}</p>
      </div>
    </a>
  `).join("")}</div>`;
}

async function load(){
  const { data, error } = await supa
    .from("submissions")
    .select("id,title,nickname,maker_type,category,product,image_paths,created_at")
    .eq("status", "approved")
    .order("created_at", { ascending: false });
  if(error){
    document.getElementById("content").innerHTML = `<div class="empty">불러오는 중 문제가 발생했어요.</div>`;
    console.error(error);
    return;
  }
  allItems = data || [];
  renderProductTabs();
  renderTopActions();
  renderFilters();
  renderGrid();
}
load();
</script>
</body></html>

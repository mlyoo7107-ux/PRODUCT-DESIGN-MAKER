<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 작품 자랑하기 — COLOR.M GALLERY</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#ff2d86;--ab:#ffb3d1;--b:#f5f6fa;--l:#e2e5ee;--t:#171512;--m:#7a7268}
*{box-sizing:border-box}
body{margin:0;background:var(--b);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);word-break:keep-all}
.wrap{max-width:560px;margin:auto;padding:0 20px}
header{text-align:center;padding:40px 20px 24px}
header small{color:var(--a);font-weight:bold;letter-spacing:2px}
header h1{margin:8px 0;font-size:24px;font-weight:900}
header p{color:var(--m);margin:0;font-size:14px}
.card{background:white;border:1px solid var(--l);border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 2px 8px rgba(23,21,18,.05)}
label{font-size:13px;font-weight:bold;display:block;margin:16px 0 6px}
label:first-child{margin-top:0}
input,textarea,select{width:100%;padding:11px;border:1px solid #e3ddd0;border-radius:9px;font-size:14px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.hint{font-size:12px;color:var(--m);margin:4px 0 0}
.preview-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;border-radius:12px;transition:background .15s,box-shadow .15s}
.preview-row.drag-over{background:#fff5fa;box-shadow:0 0 0 2px var(--a) inset}
.preview-thumb{position:relative;width:calc(33.33% - 6px);aspect-ratio:1/1;cursor:grab}
.preview-thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--l);display:block;pointer-events:none}
.preview-thumb.dragging{opacity:.4}
.preview-thumb .order{position:absolute;bottom:4px;left:4px;background:rgba(23,21,18,.6);color:white;font-size:11px;padding:2px 7px;border-radius:8px}
.preview-thumb .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#c0392b;color:white;border:0;font-size:13px;cursor:pointer;line-height:22px;text-align:center;padding:0}
.preview-thumb .move-row{position:absolute;bottom:4px;right:4px;display:flex;gap:3px}
.preview-thumb .mv{width:20px;height:20px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--t);font-size:11px;cursor:pointer;line-height:20px;text-align:center;padding:0}
.add-photo-tile{width:calc(33.33% - 6px);aspect-ratio:1/1;border:1px dashed var(--l);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--m);cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{padding:9px 12px;border:1px solid var(--l);border-radius:20px;font-size:13px;cursor:pointer}
.tab.on{background:var(--a);color:white;border-color:var(--a);font-weight:bold}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;background:#f5f6fa;border:1px solid #e2e5ee;border-radius:10px;padding:12px 14px;margin-top:20px;cursor:pointer}
.agree input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--a)}
.go{width:100%;padding:16px;background:var(--a);color:white;border:0;border-radius:28px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:18px}
.go:hover{background:#e0247a}
.go:disabled{background:var(--ab);cursor:not-allowed}
.go:disabled:hover{background:var(--a)}
.back{display:block;text-align:center;margin-top:14px;color:var(--m);font-size:13px;text-decoration:none}
.msg{font-size:13px;color:#c0392b;margin-top:10px;display:none}
.success{text-align:center;padding:40px 10px}
.success .icon{font-size:44px}
footer{text-align:center;padding:36px 15px 44px;border-top:1px solid var(--l)}
footer img{max-width:120px;opacity:.85}
footer p{margin:12px 0 0;font-size:12px;color:var(--m)}
footer a{color:var(--m)}
</style></head><body>
<div class="wrap">
<header>
<small>COLOR.M · GALLERY</small>
<h1>내 작품 자랑하기</h1>
<p>Maker로 만든 결과물을 갤러리에 올려보세요. 검토 후 공개돼요.</p>
</header>

<div class="card" id="formCard">
<form id="uploadForm">
<label>작품 종류 *</label>
<div class="tabs" id="productTabs"></div>

<label id="imageLabel">작품 이미지 * (드래그하거나 화살표로 순서 변경)</label>
<input type="file" id="imageFile" accept="image/*" multiple style="display:none">
<div class="preview-row" id="previewRow"></div>
<p class="hint" id="imageHint"></p>

<label>작품명 *</label>
<input type="text" id="title" placeholder="예: 캠핑용 모기퇴치 조명" required maxlength="40">

<label>닉네임 *</label>
<input type="text" id="nickname" placeholder="갤러리에 표시될 이름" required maxlength="20">

<label>사용한 Maker *</label>
<div class="tabs" id="makerTabs">
<div class="tab on" data-v="BASIC">BASIC</div>
<div class="tab" data-v="PRO">PRO</div>
</div>

<label>한 줄 컨셉</label>
<textarea id="concept" placeholder="이 작품을 한 줄로 소개해주세요" maxlength="150"></textarea>

<label>카테고리 *</label>
<select id="category" required>
<option value="" disabled selected>선택해주세요</option>
</select>

<label>태그 (쉼표로 구분)</label>
<input type="text" id="tags" placeholder="예: 캠핑, 조명, 모듈형">

<label class="agree"><input type="checkbox" id="consent"><span>업로드한 이미지와 정보가 <b>COLOR.M MAKER GALLERY에 공개</b>되는 것에 동의합니다. 부적절한 이미지는 승인되지 않을 수 있어요. <span style="color:var(--a)">(필수)</span></span></label>

<p class="hint" style="text-align:center;margin-top:16px">📋 제출 후 관리자 검토를 거쳐 갤러리에 공개돼요. 바로 뜨지 않아도 정상이에요!</p>
<p class="msg" id="errMsg"></p>
<button type="submit" class="go" id="submitBtn">제출하기</button>
</form>
<a class="back gallery-back" href="index.html">← 갤러리로 돌아가기</a>
</div>

<div class="card success" id="successCard" style="display:none">
<div class="icon">🎉</div>
<h2 style="margin:12px 0 8px">제출됐어요!</h2>
<p style="color:var(--m);font-size:14px">관리자 검토 후 갤러리에 공개돼요. 조금만 기다려주세요.</p>
<a class="go gallery-back" href="index.html" style="display:block;text-decoration:none;margin-top:20px">갤러리로 가기 →</a>
</div>
</div>
<footer><img src="../logo-colorm.png" alt="COLOR.M"><p>© 2026 COLOR.M · <a href="https://colorm.net" target="_blank" rel="noopener">colorm.net</a></p></footer>
<script>
const SUPABASE_URL = "https://cdrbxkwouxihsxzhhnbz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_9BNpTY7OIbFN7iMmCg9TlQ_Glu4_s9G";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const BUCKET = "gallery-images";
const PRODUCTS = {
  PRODUCT_DESIGN: { label: "🎨 제품디자인", maxImages: 5, titlePh: "예: 캠핑용 모기퇴치 조명", tagsPh: "예: 캠핑, 조명, 모듈형", categories: ["생활·가전","IT·스마트","가구·공간","헬스·뷰티","모빌리티","키즈·시니어","반려동물","스포츠·아웃도어","산업·공공","기타"] },
  CHARACTER_MAKER: { label: "🧸 캐릭터디자인", maxImages: 5, titlePh: "예: 수줍은 토끼 캐릭터 '모모'", tagsPh: "예: 토끼, 파스텔톤, 귀여운", categories: ["그림책","브랜드·마스코트","굿즈·상품","이모티콘","교육 콘텐츠","SNS 콘텐츠","영상·애니메이션","게임·콘텐츠","기타"] },
  PICTURE_BOOK_MAKER: { label: "📖 마음색 그림책", maxImages: 5, titlePh: "예: 숲속 친구들의 하루", tagsPh: "예: 동화, 자연, 어린이", categories: ["기타"] }
};
const PRODUCT_ORDER = ["PRODUCT_DESIGN","CHARACTER_MAKER","PICTURE_BOOK_MAKER"];
const requestedProduct = new URLSearchParams(location.search).get("product");
let activeProduct = PRODUCTS[requestedProduct] ? requestedProduct : "PRODUCT_DESIGN";

const prefillTitle = new URLSearchParams(location.search).get("title");
if(prefillTitle) document.getElementById("title").value = prefillTitle.slice(0, 40);

const catSelect = document.getElementById("category");
function renderCategories(){
  catSelect.innerHTML = '<option value="" disabled selected>선택해주세요</option>';
  PRODUCTS[activeProduct].categories.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });
}
/* "갤러리로" 링크는 지금 고른 메이커 탭(캐릭터·제품 등)의 갤러리로 */
function syncBackLinks(){ document.querySelectorAll(".gallery-back").forEach(a => a.href = "index.html?product=" + activeProduct); }
function renderProductTabs(){
  syncBackLinks();
  const el = document.getElementById("productTabs");
  el.innerHTML = PRODUCT_ORDER.map(key => `<div class="tab${key===activeProduct?" on":""}" data-v="${key}">${PRODUCTS[key].label}</div>`).join("");
  el.querySelectorAll(".tab").forEach(tab => {
    tab.onclick = () => {
      activeProduct = tab.dataset.v;
      renderProductTabs();
      renderCategories();
      updateImageLabels();
      renderPreviews();
    };
  });
}
renderProductTabs();
renderCategories();

/* 메이커에서 넘겨준 한 줄 컨셉 · 카테고리 · 태그 자동 입력 (없으면 빈칸 그대로) */
const prefill = new URLSearchParams(location.search);
if(prefill.get("concept")) document.getElementById("concept").value = prefill.get("concept").slice(0, 150);
if(prefill.get("tags")) document.getElementById("tags").value = prefill.get("tags").slice(0, 100);
if(PRODUCTS[activeProduct].categories.includes(prefill.get("category"))) catSelect.value = prefill.get("category");

let makerType = "BASIC";
document.querySelectorAll("#makerTabs .tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll("#makerTabs .tab").forEach(t => t.classList.remove("on"));
    tab.classList.add("on");
    makerType = tab.dataset.v;
  };
});

let compressedBlobs = [];

function compressImage(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob((blob) => resolve(blob), "image/jpeg", 0.85);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let dragIndex = null;

function renderPreviews(){
  const row = document.getElementById("previewRow");
  row.innerHTML = "";
  compressedBlobs.forEach((blob, i) => {
    const tile = document.createElement("div");
    tile.className = "preview-thumb";
    tile.draggable = true;
    tile.innerHTML = `
      <img src="${URL.createObjectURL(blob)}">
      <span class="order">${i + 1}</span>
      <button type="button" class="x">×</button>
      <div class="move-row">
        <button type="button" class="mv" data-dir="-1">◀</button>
        <button type="button" class="mv" data-dir="1">▶</button>
      </div>
    `;
    tile.querySelector(".x").onclick = () => { compressedBlobs.splice(i, 1); renderPreviews(); };
    tile.querySelectorAll(".mv").forEach(btn => {
      btn.onclick = () => {
        const j = i + parseInt(btn.dataset.dir, 10);
        if(j < 0 || j >= compressedBlobs.length) return;
        [compressedBlobs[i], compressedBlobs[j]] = [compressedBlobs[j], compressedBlobs[i]];
        renderPreviews();
      };
    });
    tile.addEventListener("dragstart", () => { dragIndex = i; tile.classList.add("dragging"); });
    tile.addEventListener("dragend", () => tile.classList.remove("dragging"));
    tile.addEventListener("dragover", (e) => e.preventDefault());
    tile.addEventListener("drop", (e) => {
      e.preventDefault();
      if(dragIndex === null || dragIndex === i) return;
      const [moved] = compressedBlobs.splice(dragIndex, 1);
      compressedBlobs.splice(i, 0, moved);
      dragIndex = null;
      renderPreviews();
    });
    row.appendChild(tile);
  });
  if(compressedBlobs.length < PRODUCTS[activeProduct].maxImages){
    const add = document.createElement("div");
    add.className = "add-photo-tile";
    add.textContent = "+";
    add.onclick = () => document.getElementById("imageFile").click();
    row.appendChild(add);
  }
}
function updateImageLabels(){
  const p = PRODUCTS[activeProduct];
  document.getElementById("imageLabel").textContent = `작품 이미지 * (최대 ${p.maxImages}장, 드래그하거나 화살표로 순서 변경)`;
  document.getElementById("imageHint").textContent = `외부 AI 이미지 생성 도구로 만든 결과물을 첨부해주세요. 최대 ${p.maxImages}장까지 올릴 수 있어요. 파일을 이 영역으로 끌어다 놓아도 돼요. (자동으로 용량이 압축돼요)`;
  document.getElementById("title").placeholder = p.titlePh;
  document.getElementById("tags").placeholder = p.tagsPh;
}
updateImageLabels();
renderPreviews();

async function addFiles(fileList){
  const files = Array.from(fileList || []).filter(f => f.type.startsWith("image/"));
  const remaining = PRODUCTS[activeProduct].maxImages - compressedBlobs.length;
  for(const f of files.slice(0, remaining)){
    const blob = await compressImage(f);
    compressedBlobs.push(blob);
  }
  renderPreviews();
}

document.getElementById("imageFile").addEventListener("change", async (ev) => {
  await addFiles(ev.target.files);
  ev.target.value = "";
});

const dropZone = document.getElementById("previewRow");
["dragenter","dragover"].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add("drag-over"); });
});
["dragleave","drop"].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove("drag-over"); });
});
dropZone.addEventListener("drop", async (e) => {
  await addFiles(e.dataTransfer.files);
});

function showError(msg){
  const el = document.getElementById("errMsg");
  el.textContent = msg;
  el.style.display = "block";
}

document.getElementById("uploadForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  document.getElementById("errMsg").style.display = "none";

  const title = document.getElementById("title").value.trim();
  const nickname = document.getElementById("nickname").value.trim();
  const concept = document.getElementById("concept").value.trim();
  const category = document.getElementById("category").value;
  const tagsRaw = document.getElementById("tags").value.trim();
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];
  const consent = document.getElementById("consent").checked;

  if(compressedBlobs.length === 0) return showError("작품 이미지를 최소 1장 첨부해주세요.");
  if(!title || !nickname || !category) return showError("필수 항목(*)을 모두 입력해주세요.");
  if(!consent) return showError("공개 동의(필수)를 체크해주세요.");

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "제출 중...";

  try {
    const paths = [];
    for(let i = 0; i < compressedBlobs.length; i++){
      const path = `${Date.now()}-${i}-${Math.random().toString(36).slice(2, 10)}.jpg`;
      const { error: uploadErr } = await supa.storage.from(BUCKET).upload(path, compressedBlobs[i], {
        contentType: "image/jpeg",
        upsert: false
      });
      if(uploadErr) throw uploadErr;
      paths.push(path);
    }

    const { error: insertErr } = await supa.from("submissions").insert({
      title, nickname, maker_type: makerType, concept, category, tags,
      image_paths: paths, consent: true, status: "pending", product: activeProduct
    });
    if(insertErr) throw insertErr;

    document.getElementById("formCard").style.display = "none";
    document.getElementById("successCard").style.display = "block";
  } catch(e) {
    console.error(e);
    showError("제출 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.");
    btn.disabled = false; btn.textContent = "제출하기";
  }
});
</script>
</body></html>
